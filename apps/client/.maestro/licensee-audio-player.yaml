appId: fr.ffdanse.connect
tags:
  - licensee
  - e2e
---
# LICENSEE · Audio player: open a track, exercise transport + BPM controls.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-licensee.yaml
- tapOn: { id: "tab-library" }
- extendedWaitUntil: { visible: { id: "library-search" }, timeout: 20000 }
- tapOn:
    text: ".*MPM.*"
    optional: true
- extendedWaitUntil:
    {
      visible: { id: "audio-player-play-button" },
      timeout: 15000,
      optional: true,
    }
- tapOn: { id: "audio-player-play-button", optional: true }
- tapOn: { id: "audio-player-bpm-toggle-button", optional: true }
- tapOn: { id: "audio-player-bpm-lock-button", optional: true }
- tapOn: { id: "audio-player-like-button", optional: true }
- tapOn: { id: "audio-player-back-button", optional: true }
