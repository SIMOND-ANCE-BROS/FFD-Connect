appId: fr.ffdanse.connect
tags:
  - auth
  - e2e
---
# Forgot-password path: link → email → submit.
# Boot + CGU gate + login screen is the flaky preamble on the iOS 26 sim —
# retry it in-flow (relaunch is cheap; the second boot is faster).
- retry:
    maxRetries: 2
    commands:
      - launchApp: { clearState: true }
      # Wait for the login screen (cold boot can take a while). The CGU gate is
      # asked after sign-in only, per account (#894).
      - extendedWaitUntil:
          visible: { id: "login-forgot-password-button" }
          timeout: 60000
- tapOn: { id: "login-forgot-password-button" }
- extendedWaitUntil:
    visible: { id: "forgot-password-email-input" }
    timeout: 15000
- tapOn: { id: "forgot-password-email-input" }
- inputText: "test.e2e@ffd.com"
- hideKeyboard:
    optional: true
- tapOn: { id: "forgot-password-submit" }
