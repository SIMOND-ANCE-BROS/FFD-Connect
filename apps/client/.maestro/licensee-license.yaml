appId: fr.ffdanse.connect
tags:
  - licensee
  - e2e
---
# LICENSEE · License: e-licence card (QR) + WDSF add affordance.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-licensee.yaml
- tapOn: { id: "tab-license" }
- extendedWaitUntil: { visible: "Mes licences", timeout: 20000 }
- assertVisible: "FFD-E2E-LIC"
# The WDSF "add" affordance is a StackedCard in the licence wallet — it sits
# behind the active card, so it's often occluded rather than scrollable-to.
# Assert it exists best-effort (don't fail the licence-screen check on stack z-order).
- extendedWaitUntil:
    visible: { id: "license-screen-add-wdsf-card" }
    timeout: 8000
    optional: true
