appId: fr.ffdanse.connect
tags:
  - licensee
  - e2e
---
# LICENSEE · "Faire un retour" (bug/feature report) from settings.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-licensee.yaml
- tapOn: { id: "tab-settings" }
# The "faire un retour" button sits low in the settings list — scroll to it.
- scrollUntilVisible:
    {
      element: { id: "settings-report-bug-button" },
      direction: DOWN,
      timeout: 20000,
    }
- tapOn: { id: "settings-report-bug-button" }
- tapOn: { id: "report-type-bug", optional: true }
- tapOn: { id: "report-title-input", optional: true }
- inputText: "E2E test report"
- hideKeyboard:
    optional: true
- back
