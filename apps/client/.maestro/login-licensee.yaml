appId: fr.ffdanse.connect
---
# Log in as licensee (test.e2e@ffd.com). Requires the seed:e2e profiles (pnpm --filter backend seed:e2e).
# On a cleared state the app shows a splash before login (cold boot can take a while).
# eraseText clears any iOS-autofilled value.
- extendedWaitUntil:
    visible: { id: "login-email-input" }
    timeout: 60000
- tapOn: { id: "login-email-input" }
- eraseText
- inputText: "test.e2e@ffd.com"
- tapOn: { id: "login-password-input" }
- eraseText
- inputText: "TestE2e123!"
# Dismiss the one-time iOS bilingual-keyboard system popup if it appears (fresh sim).
- tapOn: { text: "Continue", optional: true }
# Submit via the keyboard "done" key: the password field's onSubmitEditing fires
# onLogin. Deterministic, and avoids the submit button slipping under the keyboard
# (which yields a false "login-submit-button not found").
- pressKey: Enter
# Fallback: if Enter didn't submit, the keyboard is now dismissed so the button is tappable.
- tapOn: { id: "login-submit-button", optional: true }
# Dismiss the iOS "Enregistrer le mot de passe ?" system dialog that follows a login.
- tapOn: { text: "Plus tard", optional: true }
# CGU gate (#894): asked once per ACCOUNT, right after its first sign-in
# (no longer on the login screen). Absent once this account has accepted.
- extendedWaitUntil:
    visible: { id: "cgu-accept-button" }
    timeout: 15000
    optional: true
- tapOn: { id: "cgu-accept-button", optional: true }
# tab-career is unique to LICENSEE (STAFF and CLUB also have tab-license).
- extendedWaitUntil:
    visible: { id: "tab-career" }
    timeout: 30000
