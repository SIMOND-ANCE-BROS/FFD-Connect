appId: fr.ffdanse.connect
tags:
  - auth
  - e2e
---
# Guest entry: "Continuer en tant qu'invité" → lands on Competitions (2-tab nav).
# Boot + CGU gate + login screen is the flaky preamble on the iOS 26 sim —
# retry it in-flow (relaunch is cheap; the second boot is faster).
- retry:
    maxRetries: 2
    commands:
      - launchApp: { clearState: true }
      # Wait for the login screen (cold boot can take a while) before tapping guest.
      - extendedWaitUntil:
          visible: { id: "login-guest-button" }
          timeout: 60000
- tapOn: { id: "login-guest-button" }
# CGU gate (#894): asked for the device on entering guest mode
# (no longer on the login screen). Absent once accepted on this device.
- extendedWaitUntil:
    visible: { id: "cgu-accept-button" }
    timeout: 15000
    optional: true
- tapOn: { id: "cgu-accept-button", optional: true }
- extendedWaitUntil:
    visible: { id: "tab-competitions" }
    timeout: 20000
- assertVisible: { id: "tab-settings" }
