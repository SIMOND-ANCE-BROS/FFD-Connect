appId: fr.ffdanse.connect
tags:
  - admin
  - e2e
---
# ADMIN · Impersonation ("se connecter en tant que") from settings.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-admin.yaml
- tapOn: { id: "tab-settings" }
- extendedWaitUntil:
    { visible: { id: "settings-impersonation-button" }, timeout: 20000 }
- tapOn: { id: "settings-impersonation-button" }
- extendedWaitUntil:
    {
      visible: { id: "impersonation-search-input" },
      timeout: 10000,
      optional: true,
    }
- tapOn: { id: "impersonation-search-input", optional: true }
- inputText: "test.e2e"
- hideKeyboard:
    optional: true
- back
