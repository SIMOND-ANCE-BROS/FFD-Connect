appId: fr.ffdanse.connect
tags:
  - licensee
  - e2e
---
# LICENSEE · Library: tabs (Tout/Danses/Favoris), search, MPM filter, open a track.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-licensee.yaml
- tapOn: { id: "tab-library" }
- extendedWaitUntil: { visible: { id: "library-search" }, timeout: 20000 }
- tapOn: "Danses"
- tapOn: "Favoris"
- tapOn: "Tout"
# Search first (reliable), then exercise the filter sheet last so we never need a
# `back` that could pop the whole Library screen before re-finding the search bar.
- tapOn: { id: "library-search" }
- inputText: "Métronome"
- hideKeyboard:
    optional: true
# Seeded READY tracks (seed-e2e.ts) — assert a real track row renders (search
# above narrowed the list to the seeded "Métronome …" tracks). Matched by testID
# because the row is an accessible element (bare title is not a text node on iOS).
- assertVisible: { id: "library-track-.*" }
- tapOn: { id: "library-filter-button", optional: true }
- tapOn: { id: "library-filter-mpm-min", optional: true }
- tapOn: { text: "Réinitialiser", optional: true }
- tapOn: { text: "Fermer", optional: true }
