appId: fr.ffdanse.connect
tags:
  - licensee
  - e2e
---
# LICENSEE · Settings: theme, animations, tech info, legal pages.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-licensee.yaml
- tapOn: { id: "tab-settings" }
- extendedWaitUntil:
    { visible: { id: "settings-theme-segmented" }, timeout: 20000 }
# Theme segmented control: each tap re-themes the whole screen, so let the
# re-render settle before the next label; tolerate a missed label (native
# segmented-control text can flicker mid-transition).
- tapOn: { text: "Sombre", optional: true }
- waitForAnimationToEnd
- tapOn: { text: "Clair", optional: true }
- waitForAnimationToEnd
- tapOn: { text: "Auto", optional: true }
- waitForAnimationToEnd
# Everything below the theme control is best-effort: the settings rows (the
# Animations <Switch>, legal links, tech-info) are inside a11y-merged containers
# that iOS doesn't expose element-by-element, so we exercise them optionally
# rather than hard-asserting. The hard check above (theme segmented) confirms the
# settings screen rendered.
- tapOn: { id: "settings-animations-switch", optional: true }
- tapOn: { text: "Conditions générales d'utilisation", optional: true }
- tapOn: { text: "Politique de confidentialité", optional: true }
- tapOn: { id: "settings-tech-info-button", optional: true }
