appId: fr.ffdanse.connect
---
# Session-reuse preamble (LICENSEE). Relaunch WITHOUT clearState: keeps the
# logged-in session and resets navigation to the home tab — no reinstall, no CGU,
# no UI login (~10s instead of ~40s, and far fewer cold boots, which is what
# wedges the iOS 26 sim). Falls back to the full clearState + login path when we
# don't land in the licensee UI (logged out, guest, or another role).
# tab-career is unique to LICENSEE (STAFF and CLUB also have tab-license).
- stopApp
- launchApp
- extendedWaitUntil:
    visible: { id: "tab-career" }
    timeout: 12000
    optional: true
- runFlow:
    when:
      notVisible: { id: "tab-career" }
    file: reset-login-licensee.yaml
- extendedWaitUntil:
    visible: { id: "tab-career" }
    timeout: 30000
# Normalize the screen: background tab screens stay mounted in RN navigators
# (the hierarchy can expose them while another tab is active) — land on home.
- tapOn: { id: "tab-career" }
