appId: fr.ffdanse.connect
tags:
  - club
  - e2e
---
# CLUB · Own competitions: list, filter tabs, open the create editor.
# Fast preamble: reuse the logged-in session when it already matches this role
# (plain relaunch = fresh navigation, no reinstall/CGU/login). Falls back to the
# full clearState + login path otherwise. Retried in-flow because the iOS 26 sim
# intermittently drops taps after accumulated cold boots.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ensure-club.yaml
- tapOn: { id: "club-dashboard-competitions-row" }
- extendedWaitUntil:
    { visible: { id: "club-competitions-search" }, timeout: 20000 }
- tapOn: { id: "club-competitions-create-button" }
- extendedWaitUntil:
    { visible: { id: "competition-editor-title-input" }, timeout: 15000 }
- tapOn: { id: "competition-editor-title-input" }
- inputText: "E2E Compétition test"
- hideKeyboard:
    optional: true
- assertVisible: { id: "competition-editor-save-button" }
# The "add event" button only renders on the Épreuves (EVENTS) tab — switch to it.
- tapOn: { text: "Épreuves", optional: true }
- extendedWaitUntil:
    { visible: { id: "competition-editor-add-event-button" }, timeout: 10000 }
- back
- back
- back
