name: Project Status

# Keeps the « FFD Connect — Roadmap » Project Status in sync with the work
# (lifecycle: docs/guides/gestion-des-issues.md §8):
#
#   issue opened / reopened          → Todo
#   PR draft referencing #N          → In Progress
#   PR ready for review              → In Review
#   PR merged, `Refs #N`             → Merged    (on develop, not testable yet)
#   promotion PR merged into staging → In Beta   (every Merged card: it is now on
#                                                 TestFlight/Play; the issue is
#                                                 closed by hand once validated)
#   PR merged, `Closes/Fixes #N`     → Done      (GitHub closes the issue)
#   PR closed without merge          → Todo
#   issue closed                     → Done
#
# Feature PRs into `develop` move their referenced cards. A merged promotion
# into `staging` ships all of develop, so it moves every `Merged` card at once.
# Writing to an org Project needs a token with Projects read/write —
# GITHUB_TOKEN cannot. Fork PRs get no secrets and are skipped.
# Cost: one ~15 s job per PR/issue event; public repo → free minutes.

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, closed]
    branches: [develop, staging]

permissions:
  contents: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: SIMOND-ANCE-BROS
  PROJECT_NUMBER: 1

jobs:
  sync:
    name: Sync Project status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'issues' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Move cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret missing — Project not updated."
            exit 0
          fi
          move() { bash .github/scripts/project-status.sh "$@"; }

          if [ "$EVENT" = "issues" ]; then
            case "$ACTION" in
              opened|reopened) move "Todo" "$ISSUE" ;;
              closed)          move "Done" "$ISSUE" ;;
            esac
            exit 0
          fi

          if [ "$PR_BASE" = "staging" ]; then
            if [ "$ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
              bash .github/scripts/project-status.sh --from "Merged" "In Beta"
            fi
            exit 0
          fi

          # Issue references in the PR body (read from env, never interpolated).
          closing=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' <<<"$PR_BODY" \
            | grep -oE '[0-9]+' | sort -u || true)
          refs=$(grep -oiE '\brefs? +#[0-9]+' <<<"$PR_BODY" | grep -oE '[0-9]+' | sort -u || true)
          all=$(printf '%s\n%s\n' "$closing" "$refs" | grep -E '^[0-9]+$' | sort -u || true)

          if [ -z "$all" ]; then
            echo "::warning::PR references no issue (Closes #N / Refs #N) — see docs/guides/gestion-des-issues.md."
            exit 0
          fi

          # shellcheck disable=SC2086
          case "$ACTION" in
            closed)
              if [ "$PR_MERGED" = "true" ]; then
                if [ -n "$closing" ]; then move "Done" $closing; fi
                if [ -n "$refs" ]; then move "Merged" $refs; fi
              else
                move "Todo" $all
              fi
              ;;
            *)
              if [ "$PR_DRAFT" = "true" ]; then move "In Progress" $all; else move "In Review" $all; fi
              ;;
          esac
