# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: EAS Build & Update

on:
  # Triggered after CI passes (not directly on push).
  # NOTE: Manual CI re-runs also trigger this workflow. The gate job
  # checks client_changed via git diff, so a re-run of CI without new
  # client changes will skip all EAS jobs. Verified safe.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master, staging, develop]
  # Manual promotion of the current staging code to the TestFlight beta
  # channel, once validated on the personal ad-hoc preview channel.
  workflow_dispatch:
    inputs:
      action:
        description: >-
          Promote staging → bêta testeurs (iOS TestFlight + Android Google
          Play). resume = reprendre un build beta EXISTANT (tag/release, envoi
          si besoin, distribution) sans rebuild : renseigner build_id.
        required: true
        type: choice
        options:
          - ota
          - build
          - resume
      platform:
        description: >-
          action=build / resume : plateforme(s) visée(s). all = iOS (TestFlight)
          et Android (Google Play, test fermé) en parallèle, mêmes étapes.
        required: false
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      build_id:
        description: >-
          action=resume uniquement : ID EAS du build beta à reprendre, iOS ou
          Android (UUID, affiché dans le résumé du run qui l'a lancé).
        required: false
        type: string
      toTest:
        description: >-
          À tester en priorité (facultatif), en tête des notes testeurs des deux
          stores. Plusieurs points séparés par « ; » (ex. « Inscription à une
          compétition ; Lecture hors ligne »).
        required: false
        type: string
      notes:
        description: >-
          Notes testeurs (relecture). Laisser VIDE = génération auto depuis les
          commits conventionnels depuis le tag bêta précédent.
        required: false
        type: string

permissions: read-all

concurrency:
  group: eas-${{ github.event.workflow_run.head_branch || 'manual-beta' }}
  # A newer push supersedes an older one, but a manual promotion must never be
  # cancelled by a second dispatch: promote-beta waits on a native build that is
  # already paid for (~2 USD) and would leave it without submit/tag/distribution.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Platforms the AUTOMATIC native builds (build-staging, build-production)
  # target, space-separated (ios, android). Single source of truth: the gate
  # checks a fingerprint per platform listed here and the build jobs build from
  # the same list, so the two cannot drift. Android is not built automatically
  # yet (the manual beta promotion, promote-beta, builds both platforms):
  # enabling it on preview/production is `ios android` here and nothing else.
  AUTO_BUILD_PLATFORMS: ios

jobs:
  # ============================================================
  # GATE — Only proceed if CI passed and client code changed
  # ============================================================
  gate:
    name: Check CI result & changes
    runs-on: ubuntu-24.04
    # Workspace install + fingerprint + a few EAS API calls: ~3-4 min.
    timeout-minutes: 15
    # Only a PUSH to this repository may deploy. workflow_run's `branches` filter
    # matches the head branch NAME only: on a public repo a fork PR from a branch
    # named `staging` would otherwise run here with secrets + Azure OIDC on the
    # fork's code (head_sha). Also stops promotion PRs (head = staging) re-deploying.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      # The fingerprint decision when it could be made, else the path-based one.
      native: ${{ steps.fingerprint.outputs.native || steps.check.outputs.native }}
      # Space-separated subset of AUTO_BUILD_PLATFORMS still lacking a build of
      # the current fingerprint. Set only when the fingerprint step decided
      # native=true per platform; empty = build every platform (fallbacks).
      native_platforms: ${{ steps.fingerprint.outputs.native_platforms }}
      client_changed: ${{ steps.check.outputs.client_changed }}
      branch: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect change type
        id: check
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Cascade pushes (develop -> staging -> master) are merge commits: the
          # first parent is the branch's previous tip, so HEAD^1..HEAD is exactly
          # the cumulative promoted change. A native EAS build costs ~2 $, so only
          # force one when that diff cannot be trusted (fast-forward or direct
          # push = no merge commit).
          if [ "$BRANCH" = "staging" ] || [ "$BRANCH" = "master" ]; then
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -lt 3 ]; then
              echo "Cascade push to $BRANCH without a merge commit - forcing full build"
              echo "client_changed=true" >> "$GITHUB_OUTPUT"
              echo "native=true" >> "$GITHUB_OUTPUT"
              # Unknown diff: also stop the fingerprint step from picking OTA-only.
              echo "eas_config=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            COMPARE_SHA=$(git rev-parse HEAD^1)
          else
            # Develop: compare against the previous push (last 2 commits)
            COMPARE_SHA=$(git log --first-parent -2 --format='%H' HEAD | tail -1)
          fi

          if [ -z "$COMPARE_SHA" ]; then
            echo "No comparison base found - assuming everything changed"
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "eas_config=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$COMPARE_SHA" HEAD)
          echo "Comparing $COMPARE_SHA..HEAD (branch: $BRANCH)"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any client-related files changed
          CLIENT_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -qE "^(apps/client/|packages/shared/|pnpm-lock\.yaml)"; then
            CLIENT_CHANGED="true"
          fi
          echo "client_changed=$CLIENT_CHANGED" >> "$GITHUB_OUTPUT"

          # Path-based guess at whether a native build is needed. Only a
          # FALLBACK on staging/master: the fingerprint step below replaces it
          # whenever it can compute an answer. Deliberately conservative, since
          # it only runs when that answer is unavailable.
          NATIVE="false"
          # .easignore is not "native", but it decides WHAT REACHES EAS, so a
          # change to it can break a build that an OTA would never exercise.
          # It did on 2026-10-05: excluding apps/backend/ dropped swagger.json,
          # the client SDK was never generated and Metro failed to resolve it.
          # The fix then shipped with no native build to prove it, because this
          # very list did not mention the file.
          NATIVE_PATTERNS="^(apps/client/app\.config|apps/client/app\.json|apps/client/eas\.json|apps/client/package\.json|apps/client/\.easignore|apps/client/fingerprint\.config\.js|apps/client/openapi-ts\.config|apps/client/(ios|android|plugins|modules)/|patches/|pnpm-lock\.yaml)"
          if echo "$CHANGED_FILES" | grep -qE "$NATIVE_PATTERNS"; then
            NATIVE="true"
          fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "Result: client_changed=$CLIENT_CHANGED native(paths)=$NATIVE"

          # .easignore and eas.json shape the build but are NOT part of the
          # fingerprint: a change to them forces a build even when a binary with
          # the same fingerprint exists (see the 2026-10-05 note above).
          EAS_CONFIG="false"
          if echo "$CHANGED_FILES" | grep -qE '^apps/client/(\.easignore|eas\.json)$'; then
            EAS_CONFIG="true"
          fi
          echo "eas_config=$EAS_CONFIG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Native build decision by fingerprint (staging/master only).
      # runtimeVersion is { policy: "fingerprint" } (app.config.js): an OTA
      # reaches exactly the binaries whose runtimeVersion equals the project
      # fingerprint. So a native build (~2 USD) is needed iff no build of the
      # target profile already carries that runtimeVersion. The path list above
      # over-triggered: every lockfile or package.json bump (Dependabot, a
      # JS-only dependency) paid for a build that changed nothing native.
      # Any failure (no fingerprint policy on that commit, EAS unreachable)
      # falls back to the path-based decision: never silently skip a build.
      # ------------------------------------------------------------------
      - name: Setup pnpm & Node (fingerprint)
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        # Best effort: a failure here leaves `eas` unusable, and the next step
        # falls back to the path-based decision instead of failing the gate
        # (which would skip every OTA and build job).
        continue-on-error: true
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI (fingerprint)
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        continue-on-error: true # see above
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decide native build by fingerprint
        id: fingerprint
        # An unexpected crash must not fail the gate either: the job output
        # then falls back to steps.check.outputs.native.
        continue-on-error: true
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        working-directory: apps/client
        # Inline on purpose: workflow_run runs THIS file from the default branch
        # against the pushed commit (head_sha), which may predate any script
        # added alongside this logic.
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PATH_NATIVE: ${{ steps.check.outputs.native }}
          EAS_CONFIG: ${{ steps.check.outputs.eas_config }}
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          # Once a platform is PROVEN to lack a build (missing non-empty), a
          # later failure must not downgrade that to the path-based guess, which
          # may say false: native=true, native_platforms unset = build them all.
          missing=""
          fallback() {
            if [ -n "$missing" ]; then
              echo "::warning::$1 - but${missing} already lacks a build: native build of every platform"
              echo "native=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$1 - falling back to the path-based decision (native=$PATH_NATIVE)"
            echo "native=$PATH_NATIVE" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EAS_CONFIG" = "true" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo ".easignore / eas.json changed (outside the fingerprint): native build." | tee -a "$summary"
            exit 0
          fi

          # Before { policy: "fingerprint" } (static runtimeVersion "2.5.0"),
          # runtimeVersion is not the fingerprint and this check means nothing.
          if ! grep -qE 'runtimeVersion:[[:space:]]*\{[[:space:]]*policy:[[:space:]]*"fingerprint"' app.config.js; then
            fallback "runtimeVersion is not fingerprint-based on this commit"
          fi

          # Profile == channel for both (eas.json).
          case "$BRANCH" in
            staging) PROFILE=preview ;;
            master) PROFILE=production ;;
            *) fallback "no build profile for branch $BRANCH" ;;
          esac

          # The fingerprint differs per platform (native dirs, plugins, config):
          # an Android-only native change leaves the iOS hash untouched, so each
          # platform the build jobs build gets its own check. native=true as soon
          # as ONE of them has no build carrying its hash, and only the missing
          # ones are listed in native_platforms.
          # Validate the whole list before computing any fingerprint.
          [ -n "${AUTO_BUILD_PLATFORMS// /}" ] || fallback "AUTO_BUILD_PLATFORMS is empty"
          for platform in $AUTO_BUILD_PLATFORMS; do
            case "$platform" in
              ios | android) ;;
              *) fallback "unknown platform '$platform' in AUTO_BUILD_PLATFORMS" ;;
            esac
          done
          for platform in $AUTO_BUILD_PLATFORMS; do

            # --build-profile applies the profile's env (EXPO_PUBLIC_APP_ENV…),
            # which the fingerprint depends on: same hash `eas build` computes.
            HASH=$(eas fingerprint:generate --build-profile "$PROFILE" --platform "$platform" --json --non-interactive \
              < /dev/null 2> /dev/null | sed -n '/^{/,$p' | jq -r '.hash // empty' 2> /dev/null)
            [ -n "$HASH" ] || fallback "could not compute the $PROFILE $platform fingerprint"
            echo "Fingerprint ($PROFILE, $platform): $HASH"

            # A build already queued or running for the same fingerprint (a
            # previous push) counts too: do not pay twice for the same binary.
            # Caveat: if that pending build later errors, this push's OTA reaches
            # nobody until a new build (ota-staging's check-ota-reach warns).
            # Only a JSON ARRAY is an answer: `length` of an error object would
            # count its keys and wrongly skip the build. Any error → build.
            found=""
            for status in finished in-progress in-queue new; do
              count=$(eas build:list --channel "$PROFILE" --build-profile "$PROFILE" --platform "$platform" \
                --status "$status" --runtime-version "$HASH" --limit 1 --json --non-interactive \
                < /dev/null 2> /dev/null | sed -n '/^[[{]/,$p' \
                | jq 'if type == "array" then length else error("not an array") end' 2> /dev/null)
              if [ -z "$count" ]; then
                echo "::warning::could not list EAS $platform builds - native $platform build (fail-safe)"
                break
              fi
              if [ "$count" -gt 0 ]; then
                found="$status"
                break
              fi
            done
            if [ -n "$found" ]; then
              echo "$platform: a $found \`$PROFILE\` build already has runtime ${HASH:0:7}, OTA is enough." | tee -a "$summary"
            else
              missing="$missing $platform"
              echo "$platform: no \`$PROFILE\` build has runtime ${HASH:0:7}, native build needed (~2 USD)." | tee -a "$summary"
            fi
          done

          # Written last and together. Every early exit above goes through
          # fallback(), which writes `native` only (native_platforms stays unset
          # = build every platform); an unexpected crash writes nothing, and the
          # job output then falls back to the path-based decision.
          missing="${missing# }"
          if [ -n "$missing" ]; then
            echo "native_platforms=$missing" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # DEVELOP — OTA only (devs rebuild dev client manually for
  # native changes)
  # ============================================================
  ota-development:
    name: OTA Update (development)
    needs: [gate]
    if: needs.gate.outputs.branch == 'develop' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment injecte les vars EAS server (EXPO_PUBLIC_API_URL…) dans
        # le bundle. Sans lui, l'URL API est vide → "Network Error" au login.
        # Pas de check-ota-reach : les profils dev client n'ont pas de canal dans
        # eas.json et se rebuildent à la main, le contrôle avertirait toujours.
        run: eas update --branch development --environment development --message "$COMMIT_MSG"

  # ============================================================
  # STAGING — Full build only if native changes, OTA always
  # ============================================================
  build-staging:
    name: EAS Build (preview)
    needs: [gate]
    if: |
      needs.gate.outputs.branch == 'staging'
      && needs.gate.outputs.client_changed == 'true'
      && needs.gate.outputs.native == 'true'
    runs-on: ubuntu-24.04
    # Submits without --wait: ~8-10 min in practice (install + archive upload).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Only the platforms the gate found without a build of the current
      # fingerprint; every AUTO_BUILD_PLATFORMS entry when it fell back.
      - name: Build preview
        working-directory: apps/client
        env:
          NATIVE_PLATFORMS: ${{ needs.gate.outputs.native_platforms }}
        run: |
          set -euo pipefail
          # Unquoted on purpose (word splitting, globbing off): list -> "$@".
          set -f
          # shellcheck disable=SC2086
          set -- ${NATIVE_PLATFORMS:-$AUTO_BUILD_PLATFORMS}
          ios=false
          android=false
          for p in "$@"; do
            case "$p" in
              ios) ios=true ;;
              android) android=true ;;
              *) echo "::error::unknown platform '$p'"; exit 1 ;;
            esac
          done
          # `all` only when BOTH are listed: duplicates must not add Android.
          if [ "$ios" = true ] && [ "$android" = true ]; then PLATFORM=all
          elif [ "$ios" = true ]; then PLATFORM=ios
          elif [ "$android" = true ]; then PLATFORM=android
          else echo "::error::no platform to build"; exit 1
          fi
          echo "Building preview for: $* (--platform $PLATFORM)" | tee -a "$GITHUB_STEP_SUMMARY"
          eas build --profile preview --platform "$PLATFORM" --non-interactive

  ota-staging:
    name: OTA Update (preview)
    needs: [gate]
    if: needs.gate.outputs.branch == 'staging' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice.
    timeout-minutes: 20
    # Record only, no reviewer — this is the internal preview channel.
    environment:
      name: preview

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment preview : sans lui l'URL API n'est pas embarquée dans le
        # bundle OTA (les env de eas.json ne valent que pour `eas build`), d'où
        # "Network Error" au login sur la preview après une promotion.
        run: |
          set -euo pipefail
          eas update --branch preview --environment preview --message "$COMMIT_MSG" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Avertit seulement : build-staging tourne peut-être en parallèle.
          ../../scripts/check-ota-reach.sh preview "$RUNNER_TEMP/eas-update.json"

  # ============================================================
  # PROMOTION MANUELLE — staging → bêta testeurs, iOS ET Android
  # Un seul job, décliné par plateforme (matrice) : les deux stores suivent
  # exactement les mêmes étapes, seules les valeurs propres au store changent.
  # beta = variante distincte (FFD Connect Beta, bundle .beta, API staging) :
  # coexiste avec preview (.staging) et la prod sur un même appareil.
  # Déclenché à la main (workflow_dispatch) une fois la version validée sur le
  # canal preview :
  #   - ota    → publie le JS courant de staging sur le canal beta (les deux
  #              plateformes d'un coup : une seule jambe « OTA »)
  #   - build  → par plateforme (input `platform`, défaut : les deux) :
  #              notes → build natif `beta` → tag + release → envoi au store →
  #              distribution (iOS : scripts/testflight-distribute.ts, groupe
  #              externe « Beta FFD » + « What to Test » + Beta App Review ;
  #              Android : scripts/play-distribute.ts, notes de version de la
  #              piste `alpha`, test fermé). Plan EAS gratuit.
  #   - resume → reprend un build `beta` DÉJÀ FAIT (input build_id, et
  #              `platform` si on veut viser une seule jambe), sans rebuild
  #              (0 $) : tag/release, envoi s'il n'a pas abouti, distribution.
  # Secrets, dans l'environnement `testflight-beta` (relecteur obligatoire,
  # branches restreintes ; le nom date d'avant Android) : ASC_KEY_ID,
  # ASC_ISSUER_ID, ASC_KEY_P8 (iOS) et PLAY_SERVICE_ACCOUNT_JSON (Android, notes
  # de version ; sans lui l'étape avertit et passe).
  #
  # Nommage identique sur les deux stores : tag `beta-<version>-<ios|android>-<n°>`
  # et release « Bêta iOS 1.0.0 (18) » / « Bêta Android 1.0.0 (12) », où n° est
  # le numéro que le store affiche (CFBundleVersion / versionCode).
  #
  # Chaque attente a sa propre borne (incident 2026-10-06 : la soumission EAS
  # est restée 1 h 56 IN_QUEUE, le timeout du JOB l'a tuée et tag/release +
  # distribution ont sauté). Un build fini n'est jamais perdu : il est tagué
  # dès sa fin, et si l'envoi ou la distribution n'aboutit pas à temps la jambe
  # se termine en avertissement avec la commande `action=resume` exacte.
  # ============================================================
  promote-beta:
    name: >-
      Bêta ${{ matrix.platform == 'ios' && 'iOS · TestFlight'
      || matrix.platform == 'android' && 'Android · Google Play' || 'OTA' }}
      (${{ inputs.action }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      # Une plateforme en échec n'interrompt pas l'autre.
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.action == 'ota' && '["ota"]'
          || inputs.platform == 'ios' && '["ios"]'
          || inputs.platform == 'android' && '["android"]'
          || '["ios","android"]') }}
        # Pas d'`include` : une entrée qui ne correspond à aucune jambe en CRÉE
        # une (platform=ios ferait aussi tourner Android). Les valeurs propres à
        # chaque store sont posées par l'étape « Platform settings ».
    # Filet de sécurité seulement : chaque attente est bornée par l'étape
    # (build 75 + envoi 35 + distribution 50 min) et la somme reste en dessous,
    # pour que l'étape de suivi puisse toujours écrire la commande de reprise.
    timeout-minutes: 180
    # The environment carries a required reviewer and the store secrets (one
    # approval releases both legs). Its deployment record only keeps the LAST
    # leg: what went to each store is in the run summary and the tags.
    environment:
      name: testflight-beta
    # Nécessaire pour créer la GitHub Release (changelog testeurs).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: staging
          # Historique complet + tags : le générateur remonte au dernier tag beta-*.
          fetch-depth: 0
          # Pas de token dans .git/config : `eas build` archive le projet, et
          # l'étape GitHub Release passe GH_TOKEN explicitement.
          persist-credentials: false

      # Seul endroit où iOS et Android diffèrent par des valeurs : tout le reste
      # du job lit ces variables.
      - name: Platform settings
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios)
              NAME=iOS EAS_PLATFORM=IOS ICON=🍏 STORE='App Store Connect'
              NOTES_TITLE='TestFlight « What to Test »'
              ;;
            android)
              NAME=Android EAS_PLATFORM=ANDROID ICON=🤖 STORE='Google Play (test fermé)'
              NOTES_TITLE='Google Play « Notes de version » (500 car. max)'
              ;;
            *)
              NAME=OTA EAS_PLATFORM='' ICON=📲 STORE='canal beta (OTA)'
              NOTES_TITLE='OTA'
              ;;
          esac
          {
            echo "PLATFORM_NAME=$NAME"
            echo "EAS_PLATFORM=$EAS_PLATFORM"
            echo "PLATFORM_ICON=$ICON"
            echo "STORE_NAME=$STORE"
            echo "NOTES_TITLE=$NOTES_TITLE"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # action=resume : retrouve le build EXISTANT et se place sur son commit,
      # pour que changelog, version et tag décrivent ce qui a été construit, et
      # non la pointe actuelle de staging (qui a pu avancer depuis). Avec
      # platform=all, la jambe de l'autre plateforme s'arrête ici sans erreur.
      - name: Resolve existing beta build (resume)
        id: resolve
        if: inputs.action == 'resume'
        working-directory: apps/client
        env:
          EXPO_PUBLIC_APP_ENV: beta
          BUILD_ID: ${{ inputs.build_id }}
          REQUESTED: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BUILD_ID" \
            | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::action=resume exige build_id = UUID EAS complet du build (reçu : '$BUILD_ID')"
            exit 1
          fi
          eas build:view "$BUILD_ID" --json < /dev/null | sed -n '/^{/,$p' > "$RUNNER_TEMP/eas-build.json"
          field() { jq -r --arg k "$1" '.[$k] // empty' "$RUNNER_TEMP/eas-build.json"; }
          STATUS=$(field status)
          PLATFORM=$(field platform)
          PROFILE=$(field buildProfile)
          NUMBER=$(field appBuildVersion)
          COMMIT=$(field gitCommitHash)
          # Plateforme illisible = échec, jamais « rien à reprendre » : sinon, avec
          # platform=all, les deux jambes se mettraient de côté et le run finirait
          # vert sans rien distribuer.
          case "$PLATFORM" in
            IOS | ANDROID) ;;
            *)
              echo "::error::plateforme du build $BUILD_ID illisible (« $PLATFORM ») : eas build:view a-t-il répondu ?"
              exit 1
              ;;
          esac
          if [ "$PLATFORM" != "$EAS_PLATFORM" ]; then
            if [ "$REQUESTED" = "all" ]; then
              echo "Build $BUILD_ID : plateforme $PLATFORM, pas $EAS_PLATFORM — rien à reprendre sur cette jambe."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::build $BUILD_ID est $PLATFORM, pas $EAS_PLATFORM (input platform=$REQUESTED)"
            exit 1
          fi
          # Garde-fous : on ne reprend qu'un build `beta` terminé, issu de staging.
          if [ "$STATUS" != "FINISHED" ] || [ "$PROFILE" != "beta" ]; then
            echo "::error::build $BUILD_ID non repris : status=$STATUS profile=$PROFILE (attendu FINISHED / beta)"
            exit 1
          fi
          if [ -z "$NUMBER" ] || [ -z "$COMMIT" ]; then
            echo "::error::build $BUILD_ID sans numéro de build ou sans commit git"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" HEAD 2> /dev/null; then
            echo "::error::le commit $COMMIT du build n'est pas dans l'historique de staging"
            exit 1
          fi
          git checkout --quiet --detach "$COMMIT"
          {
            echo "id=$BUILD_ID"
            echo "number=$NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "## 🔁 Reprise du build $PLATFORM_NAME beta $NUMBER (\`$BUILD_ID\`, commit ${COMMIT:0:7}) — aucun rebuild" \
            >> "$GITHUB_STEP_SUMMARY"

      # Notes testeurs, identiques pour les deux stores : « À tester en priorité »
      # (input toTest) en tête, puis les notes fournies (relecture) OU générées
      # depuis les commits conventionnels depuis le tag bêta précédent. Chaque
      # store les tronque à sa limite (TestFlight 4000 car., Play 500) : la
      # partie « À tester » passe en premier, donc survit à la coupe.
      # beta-notes.md = corps de la release GitHub, beta-notes.txt = texte brut
      # pour les stores.
      - name: Generate tester notes
        id: notes
        if: steps.resolve.outputs.skip != 'true'
        # Notes passées via env (pas d'interpolation dans le shell → pas
        # d'injection de commande depuis le champ du formulaire).
        env:
          NOTES: ${{ inputs.notes }}
          TO_TEST: ${{ inputs.toTest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Base des notes propre à la plateforme : une promotion iOS seule ne
          # déplace pas celle d'Android (et inversement). L'OTA, commune, garde
          # le dernier tag beta-* quel qu'il soit.
          BASE=()
          if [ "$PLATFORM" = "ios" ] || [ "$PLATFORM" = "android" ]; then
            BASE=(--platform "$PLATFORM")
          fi
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > beta-notes.md
            cp beta-notes.md beta-notes.txt
          else
            # Sans titre : la release porte déjà « Bêta iOS 1.0.0 (19) ».
            node scripts/generate-changelog.mjs "${BASE[@]}" --format markdown --heading none > beta-notes.md
            node scripts/generate-changelog.mjs "${BASE[@]}" --format testflight > beta-notes.txt
          fi
          if [ -n "$TO_TEST" ]; then
            # Un point par élément séparé par « ; », espaces de bord retirés.
            mapfile -t ITEMS < <(printf '%s' "$TO_TEST" | tr ';' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | grep -v '^$')
            if [ "${#ITEMS[@]}" -gt 0 ]; then
              { echo '### 🎯 À tester en priorité'; printf -- '- %s\n' "${ITEMS[@]}"; echo; cat beta-notes.md; } > "$RUNNER_TEMP/notes.md"
              { echo 'À tester en priorité'; printf '• %s\n' "${ITEMS[@]}"; echo; cat beta-notes.txt; } > "$RUNNER_TEMP/notes.txt"
              mv "$RUNNER_TEMP/notes.md" beta-notes.md
              mv "$RUNNER_TEMP/notes.txt" beta-notes.txt
            fi
          fi
          {
            echo "## 📝 Notes testeurs ($NOTES_TITLE)"
            echo '```'
            cat beta-notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tester notes
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-notes-${{ matrix.platform }}
          path: |
            beta-notes.md
            beta-notes.txt

      # Build natif `beta`. Lancé sans --wait pour connaître son ID tout de
      # suite (il est écrit dans le résumé : une reprise reste possible même si
      # l'attente expire), puis attente BORNÉE de sa fin (file EAS gratuite +
      # ~10-30 min de build). Sortie JSON hors de l'arbre (RUNNER_TEMP) : rien
      # d'ajouté à l'archive envoyée à EAS.
      - name: Build beta
        id: build
        if: inputs.action == 'build'
        working-directory: apps/client
        timeout-minutes: 75
        env:
          BUILD_WAIT_MIN: '70'
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          eas build --platform "$PLATFORM" --profile beta --non-interactive --no-wait --json \
            < /dev/null | sed -n '/^\[/,$p' > "$RUNNER_TEMP/eas-build.json"
          BUILD_ID=$(jq -r '.[0].id // empty' "$RUNNER_TEMP/eas-build.json")
          if [ -z "$BUILD_ID" ]; then
            echo "::error::ID du build EAS introuvable dans la sortie de eas build"
            exit 1
          fi
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "## $PLATFORM_ICON Build $PLATFORM_NAME beta lancé : \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"

          deadline=$(( $(date +%s) + BUILD_WAIT_MIN * 60 ))
          while :; do
            # Une erreur passagère de la CLI ne doit pas faire échouer l'attente.
            eas build:view "$BUILD_ID" --json < /dev/null 2> /dev/null \
              | sed -n '/^{/,$p' > "$RUNNER_TEMP/eas-build-view.json" || true
            STATUS=$(jq -r '.status // empty' "$RUNNER_TEMP/eas-build-view.json" 2> /dev/null || true)
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED | CANCELED)
                echo "state=failed" >> "$GITHUB_OUTPUT"
                echo "::error::build $BUILD_ID terminé en $STATUS"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "state=pending" >> "$GITHUB_OUTPUT"
              echo "::warning::build $BUILD_ID pas terminé après $BUILD_WAIT_MIN min (statut ${STATUS:-illisible}) - il continue chez EAS, reprendre avec action=resume une fois FINISHED"
              exit 0
            fi
            echo "… build $BUILD_ID : ${STATUS:-statut illisible}"
            sleep 60
          done
          BUILD_NUMBER=$(jq -r '.appBuildVersion // empty' "$RUNNER_TEMP/eas-build-view.json")
          if [ -z "$BUILD_NUMBER" ]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::build $BUILD_ID terminé mais numéro de build illisible - reprendre avec action=resume"
            exit 0
          fi
          {
            echo "state=finished"
            echo "number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Build $PLATFORM_NAME beta **$BUILD_NUMBER** terminé." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish OTA update (beta)
        id: ota
        if: inputs.action == 'ota'
        working-directory: apps/client
        # Beta partage l'API + les clés de l'environnement EAS `preview` (Google
        # Maps/Places, Sentry, WAKE_KEY) mais reste la variante beta. Pas de
        # `--environment preview` : il impose aussi EXPO_PUBLIC_APP_ENV=preview,
        # qui l'emporte sur la valeur passée ici (vérifié). L'OTA était alors
        # calculée pour la variante preview : identité fausse, et avec la
        # runtimeVersion `fingerprint`, une empreinte qu'aucun build beta n'a —
        # l'OTA n'aurait atteint personne. On récupère donc les variables dans
        # .env.local (chargé par le bundler, qui ne surcharge jamais une variable
        # déjà posée), sans EXPO_PUBLIC_APP_ENV, et on pose beta nous-mêmes.
        env:
          EXPO_PUBLIC_APP_ENV: beta
        run: |
          set -euo pipefail
          eas env:pull --environment preview --non-interactive --path .env.local
          sed -i '/^EXPO_PUBLIC_APP_ENV=/d' .env.local
          # Bloquant, et AVANT de publier : rien ne build en parallèle ici, une
          # OTA sans build beta compatible est forcément une erreur.
          for p in ios android; do
            RUNTIME=$(eas fingerprint:generate --platform "$p" --json --non-interactive \
              | sed -n '/^{/,$p' | jq -r .hash)
            echo "{\"platform\":\"$p\",\"runtimeVersion\":\"$RUNTIME\"}"
          done | jq -s . > "$RUNNER_TEMP/beta-runtime.json"
          ../../scripts/check-ota-reach.sh beta "$RUNNER_TEMP/beta-runtime.json" --strict
          eas update --branch beta --message "promote staging @ $(git rev-parse --short HEAD)" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Contrôle après coup : l'empreinte publiée est-elle bien celle vérifiée ?
          ../../scripts/check-ota-reach.sh beta "$RUNNER_TEMP/eas-update.json" --strict

      # Published, not drafted: a draft release does NOT create its tag, and the
      # tag is how we check out what a beta actually contained. `--prerelease`
      # keeps these out of "latest release". Runs as soon as the BUILD exists
      # (or the OTA is live), BEFORE submit and distribution: the tag describes
      # the binary, which is already paid for, so a stuck submission (2026-10-06)
      # or a failed distribution must never leave a build without its tag.
      #
      # Tag = what testers see, same scheme on both stores:
      # `beta-<version>-<ios|android>-<build number>`, the number TestFlight /
      # Play display ("1.0.0 (18)"). An OTA is tagged too: without it the next
      # changelog (built from the last `beta-*` tag) would announce changes
      # testers already received. Idempotent: a resume skips it.
      - name: Tag & GitHub Release (beta, prerelease)
        id: tag
        if: >-
          !cancelled()
          && (steps.build.outputs.number != ''
          || steps.resolve.outputs.number != ''
          || steps.ota.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_NUMBER: ${{ steps.build.outputs.number || steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          # Pointe de staging (build), ou commit du build repris (resume).
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -nE 's/.*version: "([^"]+)", \/\/ x-release-please-version.*/\1/p' apps/client/app.config.js)
          if [ -z "$VERSION" ]; then
            echo "::error::version introuvable dans apps/client/app.config.js (annotation x-release-please-version)"
            exit 1
          fi
          if [ "$ACTION" = "ota" ]; then
            TAG="beta-$VERSION-ota-$(date +%Y%m%d)-${SHA:0:7}"
            TITLE="Bêta OTA $VERSION — ${SHA:0:7}"
            HEADER="Mise à jour OTA du canal beta (iOS et Android), commit ${SHA:0:7}."
          else
            TAG="beta-$VERSION-$PLATFORM-$BUILD_NUMBER"
            TITLE="Bêta $PLATFORM_NAME $VERSION ($BUILD_NUMBER)"
            HEADER="Build $PLATFORM_NAME $VERSION ($BUILD_NUMBER) — $STORE_NAME, commit ${SHA:0:7}."
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG déjà présente (relance) — rien à faire."
          else
            printf '%s\n\n' "$HEADER" | cat - beta-notes.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease \
              --target "$SHA"
          fi
          echo "🏷️ Tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      # Envoi au store, avec une attente BORNÉE : la file de soumission EAS
      # (plan gratuit) a déjà retenu une soumission 1 h 56 IN_QUEUE sans log.
      # Au-delà de SUBMIT_WAIT_MIN, l'étape s'arrête en avertissement
      # (state=pending) — la soumission, elle, continue chez EAS. En reprise, on
      # ne soumet PAS deux fois : une soumission FINISHED est acquise, une
      # soumission encore en file est attendue ; seule une soumission absente,
      # ERRORED ou CANCELED est relancée. Android : piste et statut viennent de
      # submit.beta.android (eas.json).
      # EXPO_PUBLIC_APP_ENV=beta : sans lui, app.config.js retombe sur la variante
      # development et la CLI cherche les credentials de fr.ffdanse.connect.dev
      # (cf. scripts/submit-beta.ts).
      - name: Submit to store
        id: submit
        if: >-
          !cancelled()
          && (steps.build.outputs.number != '' || steps.resolve.outputs.number != '')
        working-directory: apps/client
        timeout-minutes: 35
        env:
          EXPO_PUBLIC_APP_ENV: beta
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_ID: ${{ steps.build.outputs.id || steps.resolve.outputs.id }}
          SUBMIT_WAIT_MIN: '30'
        run: |
          set -euo pipefail
          # "<id> <status>" de la soumission la plus récente de CE build, "" si
          # aucune. Code 1 si la liste est illisible (≠ « aucune soumission »).
          latest_submission() {
            eas submit:list --platform "$PLATFORM" --limit 50 --json --non-interactive < /dev/null 2> /dev/null \
              | sed -n '/^\[/,$p' \
              | jq -re --arg b "$BUILD_ID" '
                  if type != "array" then error("not an array") else
                    [.[] | select(.submittedBuild.id == $b)] | sort_by(.createdAt) | last
                    | if . == null then "" else "\(.id) \(.status)" end
                  end' 2> /dev/null
          }
          SUB_ID=""
          SUB_STATUS=""
          if [ "$ACTION" = "resume" ]; then
            if ! found=$(latest_submission); then
              echo "::error::liste des soumissions EAS illisible : pas de nouvel envoi à l'aveugle (risque de doublon). Relancer la reprise."
              exit 1
            fi
            read -r SUB_ID SUB_STATUS <<< "$found" || true
          fi

          case "$SUB_STATUS" in
            FINISHED)
              echo "Soumission $SUB_ID déjà terminée : rien à renvoyer."
              ;;
            AWAITING_BUILD | IN_QUEUE | IN_PROGRESS)
              echo "Soumission $SUB_ID déjà en cours ($SUB_STATUS) : on l'attend, sans doublon."
              ;;
            *)
              [ -z "$SUB_STATUS" ] || echo "Soumission précédente $SUB_ID terminée en $SUB_STATUS : nouvel envoi."
              OLD_ID="$SUB_ID"
              eas submit --platform "$PLATFORM" --profile beta --id "$BUILD_ID" --non-interactive --no-wait < /dev/null
              SUB_ID=""
              for _ in 1 2 3 4 5 6; do
                found=$(latest_submission || true)
                read -r SUB_ID SUB_STATUS <<< "$found" || true
                if [ -n "$SUB_ID" ] && [ "$SUB_ID" != "$OLD_ID" ]; then break; fi
                SUB_ID=""
                sleep 10
              done
              if [ -z "$SUB_ID" ]; then
                echo "state=pending" >> "$GITHUB_OUTPUT"
                echo "::warning::soumission créée mais introuvable dans eas submit:list - vérifier sur expo.dev puis reprendre"
                exit 0
              fi
              ;;
          esac
          echo "submission=$SUB_ID" >> "$GITHUB_OUTPUT"

          deadline=$(( $(date +%s) + SUBMIT_WAIT_MIN * 60 ))
          while [ "$SUB_STATUS" != "FINISHED" ]; do
            if [ "$SUB_STATUS" = "ERRORED" ] || [ "$SUB_STATUS" = "CANCELED" ]; then
              echo "state=failed" >> "$GITHUB_OUTPUT"
              echo "::error::soumission $SUB_ID terminée en $SUB_STATUS (logs : eas submit:view $SUB_ID). La reprise la relancera."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "state=pending" >> "$GITHUB_OUTPUT"
              echo "::warning::soumission $SUB_ID toujours ${SUB_STATUS:-illisible} après $SUBMIT_WAIT_MIN min (file EAS) - elle continue chez EAS ; reprendre avec action=resume"
              echo "⏳ Soumission \`$SUB_ID\` encore **${SUB_STATUS:-illisible}** après $SUBMIT_WAIT_MIN min." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "… soumission $SUB_ID : ${SUB_STATUS:-statut illisible}"
            sleep 60
            # Erreur passagère de la CLI = statut vide, on réessaie au tour suivant.
            SUB_STATUS=$(eas submit:view "$SUB_ID" --json < /dev/null 2> /dev/null \
              | sed -n '/^{/,$p' | jq -r '.status // empty' 2> /dev/null || true)
          done
          echo "state=finished" >> "$GITHUB_OUTPUT"
          echo "📤 Envoyé sur $STORE_NAME (soumission \`$SUB_ID\`)" >> "$GITHUB_STEP_SUMMARY"

      # Distribution aux testeurs, même rôle sur les deux stores :
      # - iOS : `eas submit --groups` ne vise que les groupes INTERNES ; le
      #   groupe EXTERNE, « What to Test » et la Beta App Review passent par
      #   l'API App Store Connect.
      # - Android : `eas submit` publie déjà sur la piste ; on y pose les notes
      #   de version (fr-FR, 500 car.) via l'API Google Play. Sans la clé du
      #   compte de service, l'étape avertit et passe : le build reste publié.
      # Idempotent. --timeout borne l'attente côté store, sous celle de l'étape.
      - name: Distribute to testers
        id: distribute
        if: >-
          !cancelled() && steps.submit.outputs.state == 'finished'
        timeout-minutes: 50
        env:
          PLATFORM: ${{ matrix.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: '6787383066'
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUILD_NUMBER: ${{ steps.build.outputs.number || steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ]; then
            pnpm testflight:distribute --build-number "$BUILD_NUMBER" --notes-file beta-notes.txt --timeout 45
            echo "✅ Build iOS $BUILD_NUMBER : « What to Test », groupe « Beta FFD », Beta App Review" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON absent de l'environnement testflight-beta : build Android $BUILD_NUMBER publié sans notes de version"
            echo "⚠️ Build Android $BUILD_NUMBER publié **sans notes de version** (secret PLAY_SERVICE_ACCOUNT_JSON absent)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            pnpm play:distribute --version-code "$BUILD_NUMBER" --notes-file beta-notes.txt --timeout 45
            echo "✅ Build Android $BUILD_NUMBER : notes de version sur la piste de test fermé" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fin claire plutôt qu'un échec muet : si le build existe mais que la
      # chaîne n'est pas allée au bout, le résumé donne la commande exacte de
      # reprise (0 $, aucun rebuild). Rien à faire si tout est passé.
      - name: Follow-up (resume command if incomplete)
        if: >-
          !cancelled() && inputs.action != 'ota'
        env:
          BUILD_ID: ${{ steps.build.outputs.id || steps.resolve.outputs.id }}
          BUILD_STATE: ${{ steps.build.outputs.state }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          SUBMIT_STATE: ${{ steps.submit.outputs.state }}
          DISTRIBUTE_OUTCOME: ${{ steps.distribute.outcome }}
          PLATFORM: ${{ matrix.platform }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_ID" ]; then
            exit 0 # rien n'a été construit ni repris : l'erreur est dans l'étape fautive
          fi
          if [ "$BUILD_STATE" = "failed" ]; then
            echo "::error::le build $BUILD_ID a échoué chez EAS : un nouveau build (action=build) est nécessaire"
            exit 0
          fi
          if [ "$TAG_OUTCOME" = "success" ] && [ "$SUBMIT_STATE" = "finished" ] \
            && [ "$DISTRIBUTE_OUTCOME" = "success" ]; then
            echo "Promotion complète." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CMD="gh workflow run eas-build.yml --ref $REF -f action=resume -f platform=$PLATFORM -f build_id=$BUILD_ID"
          echo "::warning::promotion incomplète (tag=${TAG_OUTCOME:-skipped} submit=${SUBMIT_STATE:-skipped} distribution=${DISTRIBUTE_OUTCOME:-skipped}) - reprendre SANS rebuild : $CMD"
          {
            echo '## ⚠️ Promotion incomplète — reprise sans rebuild (0 $)'
            echo
            echo "| Étape | État |"
            echo "| --- | --- |"
            echo "| Build | ${BUILD_STATE:-repris} |"
            echo "| Tag & Release | ${TAG_OUTCOME:-skipped} |"
            echo "| Envoi au store | ${SUBMIT_STATE:-skipped} |"
            echo "| Distribution | ${DISTRIBUTE_OUTCOME:-skipped} |"
            echo
            echo "Une fois le build FINISHED / la soumission sortie de la file EAS (\`eas submit:list -p $PLATFORM\`) :"
            echo
            echo '```bash'
            echo "$CMD"
            echo '```'
            echo
            echo "Ou Actions → EAS Build & Update → Run workflow : \`action = resume\`, \`platform = $PLATFORM\`, \`build_id\` ci-dessus."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # MASTER — Production (réservé au lancement App Store public).
  # Full build only if native changes, OTA always.
  # ============================================================
  build-production:
    name: EAS Build (production)
    needs: [gate]
    if: |
      needs.gate.outputs.branch == 'master'
      && needs.gate.outputs.client_changed == 'true'
      && needs.gate.outputs.native == 'true'
    runs-on: ubuntu-24.04
    # Submits without --wait: ~8-10 min in practice (install + archive upload).
    # The cap does not count the time spent waiting for the reviewer.
    timeout-minutes: 30
    # Same gate as ota-production, and a native build also costs ~2 USD each.
    environment:
      name: app-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Only the platforms the gate found without a build of the current
      # fingerprint; every AUTO_BUILD_PLATFORMS entry when it fell back.
      - name: Build production
        working-directory: apps/client
        env:
          NATIVE_PLATFORMS: ${{ needs.gate.outputs.native_platforms }}
        run: |
          set -euo pipefail
          # Unquoted on purpose (word splitting, globbing off): list -> "$@".
          set -f
          # shellcheck disable=SC2086
          set -- ${NATIVE_PLATFORMS:-$AUTO_BUILD_PLATFORMS}
          ios=false
          android=false
          for p in "$@"; do
            case "$p" in
              ios) ios=true ;;
              android) android=true ;;
              *) echo "::error::unknown platform '$p'"; exit 1 ;;
            esac
          done
          # `all` only when BOTH are listed: duplicates must not add Android.
          if [ "$ios" = true ] && [ "$android" = true ]; then PLATFORM=all
          elif [ "$ios" = true ]; then PLATFORM=ios
          elif [ "$android" = true ]; then PLATFORM=android
          else echo "::error::no platform to build"; exit 1
          fi
          echo "Building production for: $* (--platform $PLATFORM)" | tee -a "$GITHUB_STEP_SUMMARY"
          eas build --profile production --platform "$PLATFORM" --non-interactive

  ota-production:
    name: OTA Update (production)
    needs: [gate]
    if: needs.gate.outputs.branch == 'master' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice (reviewer wait not counted).
    timeout-minutes: 20
    # Sharpest automatic path in the repo: this ships JavaScript straight to
    # production app users on any master push that touches the client, with no
    # store review in between. `app-production` carries a required reviewer.
    environment:
      name: app-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment production : embarque l'URL API prod dans le bundle OTA.
        run: |
          set -euo pipefail
          eas update --branch production --environment production --message "$COMMIT_MSG" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Avertit seulement : build-production tourne peut-être en parallèle.
          ../../scripts/check-ota-reach.sh production "$RUNNER_TEMP/eas-update.json"
