# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: EAS Build & Update
# The branch and SHA in the run title. Not cosmetic: the gate ("Detect change
# type") reads it back to find the last commit whose OTA was published, because
# a workflow_run run's head_sha is the default branch's, not the built one.
# Keep the " <branch> @ <40-hex sha>" suffix (same contract as deploy-backend).
# A manual run gets a title that never matches it, and names what will be
# shipped (action, platform, build number) so the approver sees it on the
# approval screen before releasing a build to testers (and, for a build,
# where it runs: GitHub runner or EAS cloud).
run-name: >-
  EAS Build & Update · ${{ github.event_name == 'workflow_dispatch'
  && format('bêta {0} {1}{2}{3} ({4})', inputs.action, inputs.platform,
  inputs.build_number != '' && format(' n°{0}', inputs.build_number) || '',
  inputs.action == 'build' && format(' via {0}', inputs.builder) || '',
  github.ref_name)
  || format('{0} @ {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) }}

on:
  # Triggered after CI passes (not directly on push).
  # NOTE: Manual CI re-runs also trigger this workflow. The gate diffs against
  # the last commit whose OTA was published, so a re-run of CI without new
  # client changes skips all EAS jobs.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master, staging, develop]
  # Manual promotion of the current staging code to the TestFlight beta
  # channel, once validated on the personal ad-hoc preview channel.
  workflow_dispatch:
    inputs:
      action:
        description: >-
          Promote staging → bêta testeurs (iOS TestFlight + Android Google
          Play). resume = reprendre un build beta EXISTANT (tag/release, envoi
          si besoin, distribution) sans rebuild : renseigner build_id.
          distribute = distribuer un build fait HORS EAS (eas build --local)
          et déjà envoyé au store : renseigner build_number et platform (ios
          ou android).
        required: true
        type: choice
        options:
          - ota
          - build
          - resume
          - distribute
      platform:
        description: >-
          action=build / resume : plateforme(s) visée(s). all = iOS (TestFlight)
          et Android (Google Play, test fermé) en parallèle, mêmes étapes.
          action=distribute : ios ou android obligatoire (all refusé).
        required: false
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      builder:
        description: >-
          action=build uniquement : où construire le binaire. github = runner
          GitHub (`eas build --local` : iOS sur macOS, Android sur Ubuntu ;
          gratuit en dépôt public, hors quota EAS), puis `eas submit --path`.
          eas = build dans le cloud EAS (quota du plan gratuit).
        required: false
        default: github
        type: choice
        options:
          - github
          - eas
      build_id:
        description: >-
          action=resume uniquement : ID EAS du build beta à reprendre, iOS ou
          Android (UUID, affiché dans le résumé du run qui l'a lancé).
        required: false
        type: string
      build_number:
        description: >-
          action=distribute uniquement : numéro du build local tel que l'affiche
          le store (CFBundleVersion iOS / versionCode Android), chiffres seuls
          (ex. 26). Le build doit déjà être envoyé sur App Store Connect /
          la piste alpha de Google Play.
        required: false
        type: string
      toTest:
        description: >-
          À tester en priorité (facultatif), en tête des notes testeurs des deux
          stores. Plusieurs points séparés par « ; » (ex. « Inscription à une
          compétition ; Lecture hors ligne »).
        required: false
        type: string
      notes:
        description: >-
          Notes testeurs (relecture). Laisser VIDE = génération auto depuis les
          commits conventionnels depuis le tag bêta précédent.
        required: false
        type: string

permissions: read-all

concurrency:
  group: eas-${{ github.event.workflow_run.head_branch || 'manual-beta' }}
  # A newer push supersedes an older one, but a manual promotion must never be
  # cancelled by a second dispatch: promote-beta waits on a native build that is
  # already paid for (~2 USD) and would leave it without submit/tag/distribution.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Platforms the AUTOMATIC native builds (build-staging, build-production)
  # target, space-separated (ios, android). Single source of truth: the gate
  # checks a fingerprint per platform listed here and the build jobs build from
  # the same list, so the two cannot drift. Android is not built automatically
  # yet (the manual beta promotion, promote-beta, builds both platforms):
  # enabling it on preview/production is `ios android` here and nothing else.
  AUTO_BUILD_PLATFORMS: ios
  # eas-cli version used by EVERY job of this workflow (#478). Pinned, never
  # `latest`: on `eas build --local` eas-cli also runs
  # `npx eas-cli-local-build-plugin@<its exact @expo/eas-build-job version>`,
  # which handles the signing credentials — so this pin also fixes the plugin
  # version (24.12.1 -> plugin 24.9.0; the plugin's own transitive deps still
  # resolve at run time, npx has no lockfile). Dependabot cannot see this value:
  # bump it by hand in a reviewed PR, with a version published >= 7 days ago
  # (same bake rule as .github/dependabot.yml), after reading the eas-cli
  # changelog (docs/exploitation/ci-cd.md, « Version d'eas-cli »).
  EAS_CLI_VERSION: '24.12.1'

jobs:
  # ============================================================
  # GATE — Only proceed if CI passed and client code changed
  # ============================================================
  gate:
    name: Check CI result & changes
    runs-on: ubuntu-24.04
    # Workspace install + fingerprint + a few EAS API calls: ~3-4 min.
    timeout-minutes: 15
    # Only a PUSH to this repository may deploy. workflow_run's `branches` filter
    # matches the head branch NAME only: on a public repo a fork PR from a branch
    # named `staging` would otherwise run here with secrets + Azure OIDC on the
    # fork's code (head_sha). Also stops promotion PRs (head = staging) re-deploying.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      # The fingerprint decision when it could be made, else the path-based one.
      native: ${{ steps.fingerprint.outputs.native || steps.check.outputs.native }}
      # Space-separated subset of AUTO_BUILD_PLATFORMS still lacking a build of
      # the current fingerprint. Set only when the fingerprint step decided
      # native=true per platform; empty = build every platform (fallbacks).
      native_platforms: ${{ steps.fingerprint.outputs.native_platforms }}
      # The same list as a JSON array, for the build jobs' matrix (the `env`
      # context is not available in `strategy`): native_platforms, else every
      # AUTO_BUILD_PLATFORMS entry.
      build_platforms: ${{ steps.platforms.outputs.json }}
      client_changed: ${{ steps.check.outputs.client_changed }}
      branch: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect change type
        id: check
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # Two diffs, two questions:
          # - "what did THIS push change?" (HEAD^1..HEAD) decides the native
          #   path fallback and eas_config: a native build is paid for once,
          #   even when the OTA of the push that needed it was never published
          #   (the fingerprint step re-checks the binary anyway);
          # - "what has changed since the last PUBLISHED OTA?" decides
          #   client_changed (#119, below).
          # grep reads here-strings, never `echo | grep -q`: with pipefail, grep
          # -q exiting early on a list larger than the pipe buffer (64 KiB,
          # master..staging is ~53 KB) SIGPIPEs echo and reads as "no match".
          full() {
            echo "$1 - assuming everything changed"
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            # Unknown diff: also stop the fingerprint step from picking OTA-only.
            echo "eas_config=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Cascade pushes (develop -> staging -> master) are merge commits: the
          # first parent is the branch's previous tip, so HEAD^1..HEAD is exactly
          # the cumulative promoted change. A native EAS build costs ~2 $, so only
          # force one when that diff cannot be trusted (fast-forward or direct
          # push = no merge commit).
          if [ "$BRANCH" = "staging" ] || [ "$BRANCH" = "master" ]; then
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -lt 3 ]; then
              full "Cascade push to $BRANCH without a merge commit"
            fi
            PREV_SHA=$(git rev-parse HEAD^1)
          else
            # Develop: the previous commit on the first-parent chain.
            PREV_SHA=$(git log --first-parent -2 --format='%H' HEAD | tail -n +2)
          fi
          [ -n "$PREV_SHA" ] || full "No previous commit"
          PUSH_FILES=$(git diff --name-only "$PREV_SHA" HEAD) || full "$PREV_SHA..HEAD diff failed"

          # Path-based guess at whether a native build is needed. Only a
          # FALLBACK on staging/master: the fingerprint step below replaces it
          # whenever it can compute an answer. Deliberately conservative, since
          # it only runs when that answer is unavailable.
          NATIVE="false"
          # .easignore is not "native", but it decides WHAT REACHES EAS, so a
          # change to it can break a build that an OTA would never exercise.
          # It did on 2026-10-05: excluding apps/backend/ dropped swagger.json,
          # the client SDK was never generated and Metro failed to resolve it.
          # The fix then shipped with no native build to prove it, because this
          # very list did not mention the file.
          NATIVE_PATTERNS="^(apps/client/app\.config|apps/client/app\.json|apps/client/eas\.json|apps/client/package\.json|apps/client/\.easignore|apps/client/fingerprint\.config\.js|apps/client/openapi-ts\.config|apps/client/(ios|android|plugins|modules)/|patches/|pnpm-lock\.yaml)"
          if grep -qE "$NATIVE_PATTERNS" <<< "$PUSH_FILES"; then
            NATIVE="true"
          fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"

          # .easignore and eas.json shape the build but are NOT part of the
          # fingerprint: a change to them forces a build even when a binary with
          # the same fingerprint exists (see the 2026-10-05 note above).
          EAS_CONFIG="false"
          if grep -qE '^apps/client/(\.easignore|eas\.json)$' <<< "$PUSH_FILES"; then
            EAS_CONFIG="true"
          fi
          echo "eas_config=$EAS_CONFIG" >> "$GITHUB_OUTPUT"

          # client_changed: base = the commit whose OTA was last PUBLISHED from
          # this branch, not HEAD^1 (#119). CI on these branches runs with
          # cancel-in-progress: when push N's CI is cancelled by push N+1 (or
          # fails without a re-run), this workflow never runs for N, and a
          # HEAD^1 base made N+1 compare N..N+1 only, so N's client change was
          # never published. Same mechanism as the backend fix of #118 (ci.yml,
          # "Backend image needed?").
          # The published SHA comes from the Actions API (GITHUB_TOKEN, no
          # secret): the most recent run of this workflow whose OTA job for the
          # branch has its "Publish OTA update" step in `success`. The step, not
          # the job: once `eas update` succeeded the bundle is out, so a run
          # that then fails or is cancelled (tag/release step) still counts. A
          # rejected production approval, or a run cancelled before that step,
          # does not. The SHA is read from the run title (`run-name` above):
          # workflow_run runs carry the default branch's head_sha, not the
          # published commit. Not `eas update:list`: it needs the EAS CLI here,
          # and it also lists OTAs published by hand from local branches.
          # Window: up to 5 pages of 100 runs (all branches mixed, newest
          # first), at most 30 job lookups; beyond that, fail safe.
          case "$BRANCH" in
            develop) OTA_JOB="OTA Update (development)" ;;
            staging) OTA_JOB="OTA Update (preview)" ;;
            master) OTA_JOB="OTA Update (production)" ;;
            *) OTA_JOB="" ;;
          esac

          find_published() {
            [ -n "$OTA_JOB" ] || return 1
            local page page_out total candidates run sha result checked=0
            for page in 1 2 3 4 5; do
              # First line: runs on the page; then this branch's runs, newest
              # first, as "<run id> <sha>". A run whose jobs were all skipped
              # (CI failed) published nothing.
              page_out=$(gh api "repos/$REPO/actions/workflows/eas-build.yml/runs?per_page=100&page=$page" \
                --jq "(.workflow_runs | length),
                      (.workflow_runs | sort_by(.run_started_at) | reverse | .[]
                      | select(.id != $RUN_ID and .conclusion != \"skipped\")
                      | (.display_title | capture(\" $BRANCH @ (?<sha>[0-9a-f]{40})\$\")?) as \$m
                      | select(\$m != null) | \"\(.id) \(\$m.sha)\")") || return 1
              total=$(head -n 1 <<< "$page_out")
              candidates=$(tail -n +2 <<< "$page_out")
              while read -r run sha; do
                [ -n "$run" ] || continue
                checked=$((checked + 1))
                [ "$checked" -le 30 ] || return 1
                result=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
                  --jq "[.jobs[] | select(.name == \"$OTA_JOB\") | .steps[]?
                         | select(.name == \"Publish OTA update\") | .conclusion] | first // \"none\"") \
                  || return 1
                if [ "$result" = "success" ]; then
                  echo "$sha"
                  return 0
                fi
              done <<< "$candidates"
              # Last page reached.
              [ "${total:-0}" -ge 100 ] || return 1
            done
            return 1
          }

          CLIENT_CHANGED="true"
          CLIENT_PATTERNS="^(apps/client/|packages/shared/|pnpm-lock\.yaml)"
          if PUBLISHED=$(find_published) && [ -n "$PUBLISHED" ]; then
            if { git cat-file -e "$PUBLISHED^{commit}" 2> /dev/null \
              || git fetch --no-tags --depth=1 origin "$PUBLISHED" > /dev/null 2>&1; } \
              && CHANGED_FILES=$(git diff --name-only "$PUBLISHED" HEAD); then
              echo "Last OTA published from $BRANCH: $PUBLISHED"
              echo "Changed since then:"
              echo "$CHANGED_FILES"
              if ! grep -qE "$CLIENT_PATTERNS" <<< "$CHANGED_FILES"; then
                CLIENT_CHANGED="false"
              fi
            else
              echo "::warning::Could not fetch or diff the last published commit $PUBLISHED - publishing the OTA (fail-safe)"
            fi
          else
            echo "Last published commit unknown (no match in the run window, or API error): OTA published anyway (fail-safe)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "client_changed=$CLIENT_CHANGED" >> "$GITHUB_OUTPUT"
          echo "This push ($PREV_SHA..HEAD):"
          echo "$PUSH_FILES"
          echo "Result: client_changed=$CLIENT_CHANGED native(paths)=$NATIVE eas_config=$EAS_CONFIG"

      # ------------------------------------------------------------------
      # Native build decision by fingerprint (staging/master only).
      # runtimeVersion is { policy: "fingerprint" } (app.config.js): an OTA
      # reaches exactly the binaries whose runtimeVersion equals the project
      # fingerprint. So a native build (~2 USD) is needed iff no build of the
      # target profile already carries that runtimeVersion. The path list above
      # over-triggered: every lockfile or package.json bump (Dependabot, a
      # JS-only dependency) paid for a build that changed nothing native.
      # Any failure (no fingerprint policy on that commit, EAS unreachable)
      # falls back to the path-based decision: never silently skip a build.
      # ------------------------------------------------------------------
      - name: Setup pnpm & Node (fingerprint)
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        # Best effort: a failure here leaves `eas` unusable, and the next step
        # falls back to the path-based decision instead of failing the gate
        # (which would skip every OTA and build job).
        continue-on-error: true
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI (fingerprint)
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        continue-on-error: true # see above
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decide native build by fingerprint
        id: fingerprint
        # An unexpected crash must not fail the gate either: the job output
        # then falls back to steps.check.outputs.native.
        continue-on-error: true
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        working-directory: apps/client
        # Inline on purpose: workflow_run runs THIS file from the default branch
        # against the pushed commit (head_sha), which may predate any script
        # added alongside this logic.
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PATH_NATIVE: ${{ steps.check.outputs.native }}
          EAS_CONFIG: ${{ steps.check.outputs.eas_config }}
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          # Once a platform is PROVEN to lack a build (missing non-empty), a
          # later failure must not downgrade that to the path-based guess, which
          # may say false: native=true, native_platforms unset = build them all.
          missing=""
          fallback() {
            if [ -n "$missing" ]; then
              echo "::warning::$1 - but${missing} already lacks a build: native build of every platform"
              echo "native=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$1 - falling back to the path-based decision (native=$PATH_NATIVE)"
            echo "native=$PATH_NATIVE" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EAS_CONFIG" = "true" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo ".easignore / eas.json changed (outside the fingerprint): native build." | tee -a "$summary"
            exit 0
          fi

          # Before { policy: "fingerprint" } (static runtimeVersion "2.5.0"),
          # runtimeVersion is not the fingerprint and this check means nothing.
          if ! grep -qE 'runtimeVersion:[[:space:]]*\{[[:space:]]*policy:[[:space:]]*"fingerprint"' app.config.js; then
            fallback "runtimeVersion is not fingerprint-based on this commit"
          fi

          # Profile == channel for both (eas.json).
          case "$BRANCH" in
            staging) PROFILE=preview ;;
            master) PROFILE=production ;;
            *) fallback "no build profile for branch $BRANCH" ;;
          esac

          # The fingerprint differs per platform (native dirs, plugins, config):
          # an Android-only native change leaves the iOS hash untouched, so each
          # platform the build jobs build gets its own check. native=true as soon
          # as ONE of them has no build carrying its hash, and only the missing
          # ones are listed in native_platforms.
          # Validate the whole list before computing any fingerprint.
          [ -n "${AUTO_BUILD_PLATFORMS// /}" ] || fallback "AUTO_BUILD_PLATFORMS is empty"
          for platform in $AUTO_BUILD_PLATFORMS; do
            case "$platform" in
              ios | android) ;;
              *) fallback "unknown platform '$platform' in AUTO_BUILD_PLATFORMS" ;;
            esac
          done
          for platform in $AUTO_BUILD_PLATFORMS; do

            # --build-profile applies the profile's env (EXPO_PUBLIC_APP_ENV…),
            # which the fingerprint depends on: same hash `eas build` computes.
            HASH=$(eas fingerprint:generate --build-profile "$PROFILE" --platform "$platform" --json --non-interactive \
              < /dev/null 2> /dev/null | sed -n '/^{/,$p' | jq -r '.hash // empty' 2> /dev/null)
            [ -n "$HASH" ] || fallback "could not compute the $PROFILE $platform fingerprint"
            echo "Fingerprint ($PROFILE, $platform): $HASH"

            # A build already queued or running for the same fingerprint (a
            # previous push) counts too: do not pay twice for the same binary.
            # Caveat: if that pending build later errors, this push's OTA reaches
            # nobody until a new build (ota-staging's check-ota-reach warns).
            # Only a JSON ARRAY is an answer: `length` of an error object would
            # count its keys and wrongly skip the build. Any error → build.
            found=""
            for status in finished in-progress in-queue new; do
              count=$(eas build:list --channel "$PROFILE" --build-profile "$PROFILE" --platform "$platform" \
                --status "$status" --runtime-version "$HASH" --limit 1 --json --non-interactive \
                < /dev/null 2> /dev/null | sed -n '/^[[{]/,$p' \
                | jq 'if type == "array" then length else error("not an array") end' 2> /dev/null)
              if [ -z "$count" ]; then
                echo "::warning::could not list EAS $platform builds - native $platform build (fail-safe)"
                break
              fi
              if [ "$count" -gt 0 ]; then
                found="$status"
                break
              fi
            done
            # A binary built on a GitHub runner (`eas build --local`, #508) has
            # no EAS build record: `eas upload` registers it without channel,
            # profile or runtime version, but with its fingerprint. The
            # fingerprint depends on the variant (bundle id, APP_ENV), so a hash
            # match is a build of this profile. Finished only: a failed cloud
            # build carries the hash too. Errors here only mean "build".
            if [ -z "$found" ]; then
              count=$(eas build:list --platform "$platform" --fingerprint-hash "$HASH" --status finished \
                --limit 1 --json --non-interactive \
                < /dev/null 2> /dev/null | sed -n '/^[[{]/,$p' \
                | jq 'if type == "array" then length else error("not an array") end' 2> /dev/null)
              if [ "${count:-0}" -gt 0 ]; then
                found="uploaded (GitHub runner)"
              fi
            fi
            if [ -n "$found" ]; then
              echo "$platform: a $found \`$PROFILE\` build already has runtime ${HASH:0:7}, OTA is enough." | tee -a "$summary"
            else
              missing="$missing $platform"
              echo "$platform: no \`$PROFILE\` build has runtime ${HASH:0:7}, native build needed." | tee -a "$summary"
            fi
          done

          # Written last and together. Every early exit above goes through
          # fallback(), which writes `native` only (native_platforms stays unset
          # = build every platform); an unexpected crash writes nothing, and the
          # job output then falls back to the path-based decision.
          missing="${missing# }"
          if [ -n "$missing" ]; then
            echo "native_platforms=$missing" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Native build platforms (matrix)
        id: platforms
        env:
          NATIVE_PLATFORMS: ${{ steps.fingerprint.outputs.native_platforms }}
        run: |
          set -euo pipefail
          # Unquoted on purpose (word splitting, globbing off). Unknown entries
          # are dropped; an empty list fails the build job visibly (empty matrix).
          set -f
          json=$(for p in ${NATIVE_PLATFORMS:-$AUTO_BUILD_PLATFORMS}; do
            case "$p" in ios | android) echo "$p" ;; esac
          done | sort -u | jq -R . | jq -cs .)
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "Native build platforms (if a build is needed): $json"

  # ============================================================
  # DEVELOP — OTA only (devs rebuild dev client manually for
  # native changes)
  # ============================================================
  ota-development:
    name: OTA Update (development)
    needs: [gate]
    if: needs.gate.outputs.branch == 'develop' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment injecte les vars EAS server (EXPO_PUBLIC_API_URL…) dans
        # le bundle. Sans lui, l'URL API est vide → "Network Error" au login.
        # Pas de check-ota-reach : les profils dev client n'ont pas de canal dans
        # eas.json et se rebuildent à la main, le contrôle avertirait toujours.
        run: eas update --branch development --environment development --message "$COMMIT_MSG"

  # ============================================================
  # STAGING — Full build only if native changes, OTA always
  # ============================================================
  build-staging:
    name: >-
      EAS Build (preview${{ matrix.platform != 'eas' && format(' · {0}', matrix.platform) || '' }})
    needs: [gate]
    if: |
      needs.gate.outputs.branch == 'staging'
      && needs.gate.outputs.client_changed == 'true'
      && needs.gate.outputs.native == 'true'
    # Builder (#508): GitHub runner by default (`eas build --local`, iOS on
    # macos-26 with Xcode pinned, Android on Ubuntu), outside the EAS build
    # quota and free on a public repository. One matrix leg per platform the
    # gate found without a build of the current fingerprint. Fallback: the
    # repository variable NATIVE_BUILDER=eas replaces the legs by a single
    # `eas build` in the EAS cloud (quota of the free plan), as before #508.
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(vars.NATIVE_BUILDER == 'eas' && '["eas"]'
          || needs.gate.outputs.build_platforms) }}
    # Runner build: ~35-45 min on macOS, ~25-35 min on Ubuntu (beta measures).
    # EAS cloud: submits without --wait, ~8-10 min.
    timeout-minutes: 120
    # Record only, no reviewer (same environment as ota-staging). Holds the
    # preview Firebase configs read by the runner build.
    environment:
      name: preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # No token in .git/config: `eas build` archives the project.
          persist-credentials: false

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      # NATIVE_BUILDER=eas fallback. Only the platforms the gate found without
      # a build of the current fingerprint; every AUTO_BUILD_PLATFORMS entry
      # when it fell back.
      - name: Build preview (EAS cloud)
        if: matrix.platform == 'eas'
        working-directory: apps/client
        env:
          NATIVE_PLATFORMS: ${{ needs.gate.outputs.native_platforms }}
        run: |
          set -euo pipefail
          # Unquoted on purpose (word splitting, globbing off): list -> "$@".
          set -f
          # shellcheck disable=SC2086
          set -- ${NATIVE_PLATFORMS:-$AUTO_BUILD_PLATFORMS}
          ios=false
          android=false
          for p in "$@"; do
            case "$p" in
              ios) ios=true ;;
              android) android=true ;;
              *) echo "::error::unknown platform '$p'"; exit 1 ;;
            esac
          done
          # `all` only when BOTH are listed: duplicates must not add Android.
          if [ "$ios" = true ] && [ "$android" = true ]; then PLATFORM=all
          elif [ "$ios" = true ]; then PLATFORM=ios
          elif [ "$android" = true ]; then PLATFORM=android
          else echo "::error::no platform to build"; exit 1
          fi
          echo "Building preview in the EAS cloud for: $* (--platform $PLATFORM)" | tee -a "$GITHUB_STEP_SUMMARY"
          eas build --profile preview --platform "$PLATFORM" --non-interactive

      # Same path as the beta promotion (promote-beta, builder=github): Firebase
      # config from this job's GitHub environment secrets, credentials frozen,
      # no Sentry source map upload. The binary never leaves the runner except
      # to EAS (next step): no GitHub artifact, the repository is public.
      - name: Build preview (GitHub runner)
        id: build
        if: matrix.platform != 'eas'
        timeout-minutes: 100
        uses: ./.github/actions/eas-local-build
        with:
          platform: ${{ matrix.platform }}
          profile: preview
          firebase-b64: >-
            ${{ matrix.platform == 'ios' && secrets.FIREBASE_IOS_PLIST_PREVIEW_B64
            || secrets.FIREBASE_ANDROID_JSON_PREVIEW_B64 }}
          firebase-secret-name: >-
            ${{ matrix.platform == 'ios' && 'FIREBASE_IOS_PLIST_PREVIEW_B64'
            || 'FIREBASE_ANDROID_JSON_PREVIEW_B64' }}

      # `eas upload` registers the local binary on expo.dev: install link /
      # download from the project's build page (Expo account members only), and
      # an EAS record carrying its fingerprint, which the gate and
      # check-ota-reach.sh look up (eas build:list --fingerprint-hash). It
      # stores a file, it runs no build: not counted in the EAS build quota.
      - name: Upload to EAS (eas upload)
        if: matrix.platform != 'eas'
        working-directory: apps/client
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_PATH: ${{ steps.build.outputs.path }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
        run: |
          set -euo pipefail
          trap 'rm -f "$BUILD_PATH"' EXIT
          args=(--platform "$PLATFORM" --build-path "$BUILD_PATH" --non-interactive --json)
          if [ -n "$FINGERPRINT" ]; then
            args+=(--fingerprint "$FINGERPRINT")
          fi
          if ! out=$(eas upload "${args[@]}" < /dev/null); then
            echo "::error::eas upload a échoué : binaire perdu (non conservé), le prochain push le reconstruira"
            exit 1
          fi
          url=$(sed -n '/^{/,$p' <<< "$out" | jq -r '.url // empty' 2> /dev/null || true)
          echo "📦 Binaire preview $PLATFORM envoyé sur EAS : ${url:-voir expo.dev}" | tee -a "$GITHUB_STEP_SUMMARY"

  ota-staging:
    name: OTA Update (preview)
    needs: [gate]
    if: needs.gate.outputs.branch == 'staging' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice.
    timeout-minutes: 20
    # Record only, no reviewer — this is the internal preview channel.
    environment:
      name: preview
    # contents: write — tag + GitHub Release of the preview OTA.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Tags + history: the release notes list the commits since the
          # previous preview OTA.
          fetch-depth: 0

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment preview : sans lui l'URL API n'est pas embarquée dans le
        # bundle OTA (les env de eas.json ne valent que pour `eas build`), d'où
        # "Network Error" au login sur la preview après une promotion.
        run: |
          set -euo pipefail
          eas update --branch preview --environment preview --message "$COMMIT_MSG" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Avertit seulement : build-staging tourne peut-être en parallèle.
          ../../scripts/check-ota-reach.sh preview "$RUNNER_TEMP/eas-update.json"

      # One prerelease per preview OTA, so every bundle shipped to the preview
      # app is traceable (commit + changes since the previous preview OTA). The
      # `preview-*` tag never matches `beta-*`: the beta notes base is untouched.
      - name: Tag & GitHub Release (preview OTA, prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -nE 's/.*version: "([^"]+)", \/\/ x-release-please-version.*/\1/p' apps/client/app.config.js)
          if [ -z "$VERSION" ]; then
            echo "::error::version not found in apps/client/app.config.js (x-release-please-version annotation)"
            exit 1
          fi
          TAG="preview-$VERSION-ota-$(date -u +%Y%m%d)-${SHA:0:7}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists (re-run) - nothing to do."
            exit 0
          fi
          # Base = previous preview OTA, else the generator's default (last beta-* tag).
          SINCE=()
          if PREV=$(git describe --tags --match 'preview-*-ota-*' --abbrev=0 "$SHA^" 2> /dev/null); then
            SINCE=(--since "$PREV")
          fi
          {
            printf 'OTA update on the preview channel (iOS and Android), commit %s.\n\n' "${SHA:0:7}"
            node scripts/generate-changelog.mjs "${SINCE[@]}" --format markdown --heading none
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --title "Preview OTA $VERSION — ${SHA:0:7}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --target "$SHA"
          echo "🏷️ Tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # PROMOTION MANUELLE — staging → bêta testeurs, iOS ET Android
  # Un seul job, décliné par plateforme (matrice) : les deux stores suivent
  # exactement les mêmes étapes, seules les valeurs propres au store changent.
  # beta = variante distincte (FFD Connect Beta, bundle .beta, API staging) :
  # coexiste avec preview (.staging) et la prod sur un même appareil.
  # Déclenché à la main (workflow_dispatch) une fois la version validée sur le
  # canal preview :
  #   - ota    → publie le JS courant de staging sur le canal beta (les deux
  #              plateformes d'un coup : une seule jambe « OTA »)
  #   - build  → par plateforme (input `platform`, défaut : les deux) :
  #              notes → build natif `beta` → envoi au store, puis tag +
  #              release (job release-beta) et (job distribute-beta,
  #              2ᵉ approbation) distribution
  #              (iOS : scripts/testflight-distribute.ts, groupe externe
  #              « Beta FFD » + « What to Test » + Beta App Review ; Android :
  #              scripts/play-distribute.ts, notes de version de la piste
  #              `alpha`, test fermé). Plan EAS gratuit.
  #              Input `builder` : `github` (défaut) construit SUR LE RUNNER
  #              (`eas build --local` : iOS sur macos-26, Android sur Ubuntu),
  #              hors quota EAS et gratuit en dépôt public, puis envoie le
  #              binaire avec `eas submit --path` ; `eas` = build cloud EAS.
  #   - resume → reprend un build `beta` DÉJÀ FAIT (input build_id, et
  #              `platform` si on veut viser une seule jambe), sans rebuild
  #              (0 $) : tag/release, envoi s'il n'a pas abouti, distribution.
  #   - distribute → build fait HORS EAS (`eas build --local`, quota iOS du
  #              plan gratuit épuisé) et envoyé au store à la main : aucun
  #              enregistrement EAS, seul le numéro de build (input
  #              build_number, platform ios OU android) l'identifie. Ni build,
  #              ni eas-cli, ni envoi : notes, tag/release, puis distribution.
  # DEUX approbations humaines, une par environnement (relecteur obligatoire,
  # branches develop/staging seulement) :
  #   1. promote-beta — environnement `testflight-build` (secrets du BUILD
  #      seulement : config Firebase beta) — « on lance le build / l'envoi ? » ;
  #   2. distribute-beta — environnement `testflight-beta` (clés de
  #      distribution des stores ; le nom date d'avant Android) — « le build
  #      est sur le store, on l'envoie aux testeurs ? ».
  # promote-beta n'a NI jeton OIDC, NI clé de distribution, NI droit
  # d'écriture sur le dépôt (contents: read, #477) : `pnpm install`, eas-cli,
  # CocoaPods, Gradle et fastlane tournent ici. Le tag et la release sont posés
  # par release-beta, petit job sans code tiers, à partir de l'état transmis ;
  # les clés (Key Vault `ffd-connect-release-kv`, ADR-0020) ne sont lues que
  # dans distribute-beta. beta-follow-up écrit la commande de reprise si la
  # chaîne n'est pas allée au bout.
  #
  # Nommage identique sur les deux stores : tag `beta-<version>-<ios|android>-<n°>`
  # et release « Beta iOS 1.0.0 (18) » / « Beta Android 1.0.0 (12) », où n° est
  # le numéro que le store affiche (CFBundleVersion / versionCode).
  #
  # Chaque attente a sa propre borne (incident 2026-10-06 : la soumission EAS
  # est restée 1 h 56 IN_QUEUE, le timeout du JOB l'a tuée et tag/release +
  # distribution ont sauté). Un build fini n'est jamais perdu : son état est
  # transmis quoi qu'il arrive (always()) et release-beta le tague même si
  # l'envoi échoue ; si l'envoi ou la distribution n'aboutit pas à temps la
  # jambe se termine en avertissement avec la commande `action=resume` exacte.
  # ============================================================
  promote-beta:
    name: >-
      Bêta ${{ matrix.platform == 'ios' && 'iOS · TestFlight'
      || matrix.platform == 'android' && 'Android · Google Play' || 'OTA' }}
      (${{ inputs.action }})
    if: github.event_name == 'workflow_dispatch'
    # macOS seulement pour la jambe iOS d'un build sur runner GitHub (Xcode) ;
    # tout le reste (OTA, resume, distribute, build cloud EAS, Android) sur
    # Ubuntu. Les étapes de ce job restent compatibles bash 3.2 (/bin/bash de
    # macOS) : ni `mapfile`, ni `sed -i`, ni tableau vide développé sous set -u.
    runs-on: >-
      ${{ inputs.action == 'build' && inputs.builder != 'eas'
      && matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    strategy:
      # Une plateforme en échec n'interrompt pas l'autre.
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.action == 'ota' && '["ota"]'
          || inputs.platform == 'ios' && '["ios"]'
          || inputs.platform == 'android' && '["android"]'
          || '["ios","android"]') }}
        # Pas d'`include` : une entrée qui ne correspond à aucune jambe en CRÉE
        # une (platform=ios ferait aussi tourner Android). Les valeurs propres à
        # chaque store sont posées par l'étape « Platform settings ».
    # Filet de sécurité seulement : chaque attente est bornée par l'étape
    # (build 75 min cloud / 100 min runner + envoi 35 min) et la somme reste en
    # dessous, pour que l'état de reprise soit toujours transmis au suivi.
    timeout-minutes: 180
    # Approval #1: the environment carries a required reviewer (one approval
    # releases both legs). Its deployment record only keeps the LAST leg: what
    # went to each store is in the run summary and the tags.
    # `testflight-build`, NOT `testflight-beta` (#479): this job runs
    # third-party code, so its environment holds only what the build needs
    # (FIREBASE_*_BETA_B64), never the store distribution keys.
    environment:
      name: testflight-build
    # contents: read only (#477) — the tag and the release are created by
    # release-beta. No id-token: this job runs pnpm install, eas-cli, CocoaPods
    # and Gradle, it must not be able to mint the token that opens the key
    # vault. GH_TOKEN below only reads PR descriptions (tester notes).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: staging
          # Historique complet + tags : le générateur remonte au dernier tag beta-*.
          fetch-depth: 0
          # Pas de token dans .git/config : `eas build` archive le projet, et
          # les notes lisent les PR avec un GH_TOKEN passé explicitement.
          persist-credentials: false

      # Seul endroit où iOS et Android diffèrent par des valeurs : tout le reste
      # du job lit ces variables.
      - name: Platform settings
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios)
              NAME=iOS EAS_PLATFORM=IOS ICON=🍏 STORE='App Store Connect'
              NOTES_TITLE='TestFlight « What to Test »'
              ;;
            android)
              NAME=Android EAS_PLATFORM=ANDROID ICON=🤖 STORE='Google Play (closed testing)'
              NOTES_TITLE='Google Play « Notes de version » (500 car. max)'
              ;;
            *)
              NAME=OTA EAS_PLATFORM='' ICON=📲 STORE='beta channel (OTA)'
              NOTES_TITLE='OTA'
              ;;
          esac
          {
            echo "PLATFORM_NAME=$NAME"
            echo "EAS_PLATFORM=$EAS_PLATFORM"
            echo "PLATFORM_ICON=$ICON"
            echo "STORE_NAME=$STORE"
            echo "NOTES_TITLE=$NOTES_TITLE"
          } >> "$GITHUB_ENV"

      # Build iOS sur runner : Xcode ÉPINGLÉ, pour qu'un changement du Xcode par
      # défaut de l'image ne change pas le binaire en silence. 26.6 compile
      # expo-modules-jsi 57.1.1 (26.3 non : #468). Chemin vérifié sur l'image
      # macos-26 (actions/runner-images, macos-26-arm64-Readme.md) ; fastlane et
      # CocoaPods, requis par `eas build --local`, y sont préinstallés.
      - name: Select Xcode (GitHub build, iOS)
        if: >-
          inputs.action == 'build' && inputs.builder != 'eas'
          && matrix.platform == 'ios'
        env:
          XCODE_APP: /Applications/Xcode_26.6.app
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP absent de l'image macos-26 : choisir un Xcode présent (actions/runner-images)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          for tool in fastlane pod; do
            command -v "$tool" > /dev/null || { echo "::error::$tool absent du runner"; exit 1; }
          done

      # Build Android sur runner : ~14 Go libres sur ubuntu-24.04, juste pour
      # le workspace + Gradle. On retire des SDK inutiles ici (pas Android).
      - name: Free disk space (GitHub build, Android)
        if: >-
          inputs.action == 'build' && inputs.builder != 'eas'
          && matrix.platform == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          df -h /

      - name: Setup pnpm & Node
        if: inputs.action != 'distribute'
        uses: ./.github/actions/setup-pnpm

      # distribute : ni eas-cli ni dépendances (le générateur de notes n'importe
      # que des modules intégrés) — Node seul, et pas de jeton Expo exposé.
      - name: Setup Node (distribute)
        if: inputs.action == 'distribute'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup EAS CLI
        if: inputs.action != 'distribute'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      # Build sur runner : caches ccache + CocoaPods (iOS, #512 ; sans effet
      # sur Android), après la sélection de Xcode (clé = version de Xcode).
      - name: Restore native build caches (GitHub build)
        if: inputs.action == 'build' && inputs.builder != 'eas'
        uses: ./.github/actions/native-build-cache
        with:
          step: restore
          platform: ${{ matrix.platform }}

      # Diagnostic seulement (#512) : l'étape doctor du build est désactivée
      # (EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP) ; résultat dans le résumé du run.
      - name: Expo doctor (GitHub build, non bloquant)
        if: inputs.action == 'build' && inputs.builder != 'eas'
        continue-on-error: true
        uses: ./.github/actions/expo-doctor
        with:
          app-env: beta

      # action=resume : retrouve le build EXISTANT et se place sur son commit,
      # pour que changelog, version et tag décrivent ce qui a été construit, et
      # non la pointe actuelle de staging (qui a pu avancer depuis). Avec
      # platform=all, la jambe de l'autre plateforme s'arrête ici sans erreur.
      - name: Resolve existing beta build (resume)
        id: resolve
        if: inputs.action == 'resume'
        working-directory: apps/client
        env:
          EXPO_PUBLIC_APP_ENV: beta
          BUILD_ID: ${{ inputs.build_id }}
          REQUESTED: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BUILD_ID" \
            | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::action=resume exige build_id = UUID EAS complet du build (reçu : '$BUILD_ID')"
            exit 1
          fi
          eas build:view "$BUILD_ID" --json < /dev/null | sed -n '/^{/,$p' > "$RUNNER_TEMP/eas-build.json"
          field() { jq -r --arg k "$1" '.[$k] // empty' "$RUNNER_TEMP/eas-build.json"; }
          STATUS=$(field status)
          PLATFORM=$(field platform)
          PROFILE=$(field buildProfile)
          NUMBER=$(field appBuildVersion)
          COMMIT=$(field gitCommitHash)
          # Plateforme illisible = échec, jamais « rien à reprendre » : sinon, avec
          # platform=all, les deux jambes se mettraient de côté et le run finirait
          # vert sans rien distribuer.
          case "$PLATFORM" in
            IOS | ANDROID) ;;
            *)
              echo "::error::plateforme du build $BUILD_ID illisible (« $PLATFORM ») : eas build:view a-t-il répondu ?"
              exit 1
              ;;
          esac
          if [ "$PLATFORM" != "$EAS_PLATFORM" ]; then
            if [ "$REQUESTED" = "all" ]; then
              echo "Build $BUILD_ID : plateforme $PLATFORM, pas $EAS_PLATFORM — rien à reprendre sur cette jambe."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::build $BUILD_ID est $PLATFORM, pas $EAS_PLATFORM (input platform=$REQUESTED)"
            exit 1
          fi
          # Garde-fous : on ne reprend qu'un build `beta` terminé, issu de staging.
          if [ "$STATUS" != "FINISHED" ] || [ "$PROFILE" != "beta" ]; then
            echo "::error::build $BUILD_ID non repris : status=$STATUS profile=$PROFILE (attendu FINISHED / beta)"
            exit 1
          fi
          if [ -z "$NUMBER" ] || [ -z "$COMMIT" ]; then
            echo "::error::build $BUILD_ID sans numéro de build ou sans commit git"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" HEAD 2> /dev/null; then
            echo "::error::le commit $COMMIT du build n'est pas dans l'historique de staging"
            exit 1
          fi
          git checkout --quiet --detach "$COMMIT"
          {
            echo "id=$BUILD_ID"
            echo "number=$NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "## 🔁 Reprise du build $PLATFORM_NAME beta $NUMBER (\`$BUILD_ID\`, commit ${COMMIT:0:7}) — aucun rebuild" \
            >> "$GITHUB_STEP_SUMMARY"

      # action=distribute : build LOCAL (`eas build --local`), déjà envoyé au
      # store hors CI (Transporter / `eas submit --path` / Play Console). Pas
      # d'ID EAS : on se place sur le commit qu'il décrit — celui d'un tag
      # `beta-*-<plateforme>-<n°>` s'il existe déjà (posé à la main quand
      # staging a avancé depuis le build), sinon la pointe de staging — puis
      # notes et passage de relais à release-beta (tag/release, idempotents)
      # et à distribute-beta, qui attend lui-même que le store ait traité le
      # build.
      - name: Resolve local beta build (distribute)
        id: local
        if: inputs.action == 'distribute'
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          REQUESTED: ${{ inputs.platform }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" != "ios" ] && [ "$REQUESTED" != "android" ]; then
            echo "::error::action=distribute exige platform=ios ou platform=android (reçu : all) : un numéro de build ne désigne qu'un seul store"
            exit 1
          fi
          # [[ =~ ]] ancre sur la chaîne entière (pas de « 26⏎… »). Pas de zéro
          # en tête : « 026 » donnerait un tag différent du numéro affiché.
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::action=distribute exige build_number = numéro du build en chiffres seuls (ex. 26)"
            exit 1
          fi
          mapfile -t TAGS < <(git tag -l "beta-*-$PLATFORM-$BUILD_NUMBER")
          TAG=""
          case "${#TAGS[@]}" in
            0) echo "Aucun tag pour le build $PLATFORM_NAME $BUILD_NUMBER : il décrira la pointe de staging." ;;
            1) TAG="${TAGS[0]}" ;;
            *)
              echo "::error::plusieurs tags pour le build $PLATFORM_NAME $BUILD_NUMBER (${TAGS[*]}) : n'en garder qu'un"
              exit 1
              ;;
          esac
          if [ -n "$TAG" ]; then
            COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
            if ! git merge-base --is-ancestor "$COMMIT" HEAD 2> /dev/null; then
              echo "::error::le commit ${COMMIT:0:7} du tag $TAG n'est pas dans l'historique de staging"
              exit 1
            fi
            git checkout --quiet --detach "$COMMIT"
          fi
          VERSION=$(sed -nE 's/.*version: "([^"]+)", \/\/ x-release-please-version.*/\1/p' apps/client/app.config.js)
          if [ -z "$VERSION" ]; then
            echo "::error::version introuvable dans apps/client/app.config.js (annotation x-release-please-version)"
            exit 1
          fi
          # L'étape Tag recalcule ce nom : un tag existant d'une autre version
          # donnerait sinon un SECOND tag pour le même build.
          if [ -n "$TAG" ] && [ "$TAG" != "beta-$VERSION-$PLATFORM-$BUILD_NUMBER" ]; then
            echo "::error::tag $TAG incohérent avec la version $VERSION de son commit (attendu beta-$VERSION-$PLATFORM-$BUILD_NUMBER)"
            exit 1
          fi
          {
            echo "number=$BUILD_NUMBER"
            # Envoi au store fait hors CI : distribute-beta ne part que sur
            # submit_state=finished, et son script attend de toute façon que
            # le store ait reçu et traité ce numéro (--timeout 45).
            echo "submit_state=finished"
          } >> "$GITHUB_OUTPUT"
          echo "## $PLATFORM_ICON Build local $PLATFORM_NAME beta $BUILD_NUMBER (commit $(git rev-parse --short HEAD)${TAG:+, tag $TAG}) — ni build ni envoi par la CI" \
            >> "$GITHUB_STEP_SUMMARY"

      # Deux textes, deux publics :
      # - beta-notes.txt → testeurs (What to Test, notes Play) : EN FRANÇAIS,
      #   tiré de la section « ## Pour les testeurs » des PR depuis le tag bêta
      #   précédent (generate-changelog --format testers) ;
      # - beta-notes.md → release GitHub, pour l'équipe : liste technique des
      #   commits conventionnels (en anglais, comme les commits).
      # « À tester en priorité » (input toTest) passe en tête des deux ; l'input
      # notes remplace la génération auto (relecture). Le texte testeurs généré
      # tient dans la limite du store (--platform : TestFlight 4000 car., Play
      # 500) : « À tester » d'abord, puis des points entiers et « … et d'autres
      # corrections et améliorations. » (tester-notes.mjs). Des notes saisies à
      # la main restent coupées par le store / les scripts de distribution.
      # Le générateur vient du commit du WORKFLOW (github.sha : la réf du
      # dispatch, develop), pas de l'arbre décrit (staging) : le workflow lui
      # passe des options (--to-test) qu'un générateur plus ancien ignorerait
      # sans erreur — « À tester » aurait alors disparu des stores.
      - name: Generate tester notes
        id: notes
        if: steps.resolve.outputs.skip != 'true'
        # Notes passées via env (pas d'interpolation dans le shell → pas
        # d'injection de commande depuis le champ du formulaire).
        env:
          NOTES: ${{ inputs.notes }}
          TO_TEST: ${{ inputs.toTest }}
          PLATFORM: ${{ matrix.platform }}
          # Lecture des descriptions de PR (format testers).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Base des notes propre à la plateforme : une promotion iOS seule ne
          # déplace pas celle d'Android (et inversement). L'OTA, commune, garde
          # le dernier tag beta-* quel qu'il soit.
          BASE=()
          if [ "$PLATFORM" = "ios" ] || [ "$PLATFORM" = "android" ]; then
            BASE=(--platform "$PLATFORM")
          fi
          GEN="$RUNNER_TEMP/changelog-tools"
          mkdir -p "$GEN"
          git cat-file -e "$GITHUB_SHA^{commit}" 2> /dev/null \
            || git fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          for f in generate-changelog.mjs tester-notes.mjs; do
            git show "$GITHUB_SHA:scripts/$f" > "$GEN/$f"
          done
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > beta-notes.md
            cp beta-notes.md beta-notes.txt
          else
            # Sans titre : la release porte déjà « Beta iOS 1.0.0 (19) ».
            node "$GEN/generate-changelog.mjs" "${BASE[@]}" --format markdown --heading none > beta-notes.md
            # « À tester » est intégré par le générateur, dans la limite du store.
            node "$GEN/generate-changelog.mjs" "${BASE[@]}" --format testers --to-test "$TO_TEST" > beta-notes.txt
          fi
          if [ -n "$TO_TEST" ]; then
            # Un point par élément séparé par « ; », espaces de bord retirés.
            # Boucle read plutôt que mapfile : la jambe iOS d'un build sur
            # runner GitHub tourne sous le bash 3.2 de macOS.
            ITEMS=()
            while IFS= read -r item || [ -n "$item" ]; do
              if [ -n "$item" ]; then ITEMS+=("$item"); fi
            done < <(printf '%s\n' "$TO_TEST" | tr ';' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            if [ "${#ITEMS[@]}" -gt 0 ]; then
              { echo '### 🎯 Test first'; printf -- '- %s\n' "${ITEMS[@]}"; echo; cat beta-notes.md; } > "$RUNNER_TEMP/notes.md"
              mv "$RUNNER_TEMP/notes.md" beta-notes.md
              if [ -n "$NOTES" ]; then
                { echo 'À tester en priorité'; printf '• %s\n' "${ITEMS[@]}"; echo; cat beta-notes.txt; } > "$RUNNER_TEMP/notes.txt"
                mv "$RUNNER_TEMP/notes.txt" beta-notes.txt
              fi
            fi
          fi
          {
            echo "## 📝 Notes testeurs ($NOTES_TITLE)"
            echo '```'
            cat beta-notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tester notes
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-notes-${{ matrix.platform }}
          path: |
            beta-notes.md
            beta-notes.txt

      # builder=eas — build natif `beta` dans le cloud EAS. Lancé sans --wait pour connaître son ID tout de
      # suite (il est écrit dans le résumé : une reprise reste possible même si
      # l'attente expire), puis attente BORNÉE de sa fin (file EAS gratuite +
      # ~10-30 min de build). Sortie JSON hors de l'arbre (RUNNER_TEMP) : rien
      # d'ajouté à l'archive envoyée à EAS.
      - name: Build beta (EAS cloud)
        id: build
        if: inputs.action == 'build' && inputs.builder == 'eas'
        working-directory: apps/client
        timeout-minutes: 75
        env:
          BUILD_WAIT_MIN: '70'
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          eas build --platform "$PLATFORM" --profile beta --non-interactive --no-wait --json \
            < /dev/null | sed -n '/^\[/,$p' > "$RUNNER_TEMP/eas-build.json"
          BUILD_ID=$(jq -r '.[0].id // empty' "$RUNNER_TEMP/eas-build.json")
          if [ -z "$BUILD_ID" ]; then
            echo "::error::ID du build EAS introuvable dans la sortie de eas build"
            exit 1
          fi
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "## $PLATFORM_ICON Build $PLATFORM_NAME beta lancé : \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"

          deadline=$(( $(date +%s) + BUILD_WAIT_MIN * 60 ))
          while :; do
            # Une erreur passagère de la CLI ne doit pas faire échouer l'attente.
            eas build:view "$BUILD_ID" --json < /dev/null 2> /dev/null \
              | sed -n '/^{/,$p' > "$RUNNER_TEMP/eas-build-view.json" || true
            STATUS=$(jq -r '.status // empty' "$RUNNER_TEMP/eas-build-view.json" 2> /dev/null || true)
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED | CANCELED)
                echo "state=failed" >> "$GITHUB_OUTPUT"
                echo "::error::build $BUILD_ID terminé en $STATUS"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "state=pending" >> "$GITHUB_OUTPUT"
              echo "::warning::build $BUILD_ID pas terminé après $BUILD_WAIT_MIN min (statut ${STATUS:-illisible}) - il continue chez EAS, reprendre avec action=resume une fois FINISHED"
              exit 0
            fi
            echo "… build $BUILD_ID : ${STATUS:-statut illisible}"
            sleep 60
          done
          BUILD_NUMBER=$(jq -r '.appBuildVersion // empty' "$RUNNER_TEMP/eas-build-view.json")
          if [ -z "$BUILD_NUMBER" ]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::build $BUILD_ID terminé mais numéro de build illisible - reprendre avec action=resume"
            exit 0
          fi
          {
            echo "state=finished"
            echo "number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Build $PLATFORM_NAME beta **$BUILD_NUMBER** terminé." >> "$GITHUB_STEP_SUMMARY"

      # builder=github — build natif `beta` SUR CE RUNNER (`eas build --local`),
      # hors quota EAS (plan gratuit : quota iOS épuisé jusqu'au 2026-11-01).
      # Même profil, mêmes credentials de signature (gérés par EAS, téléchargés
      # par eas-cli avec EXPO_TOKEN, qui permettait déjà de les lire ici ;
      # --freeze-credentials : jamais modifiés), même compteur de build distant
      # (autoIncrement : un échec consomme un numéro). Ce que le builder EAS
      # fournit et le runner non :
      # - les variables EAS « secret » de type file (config Firebase) : lues
      #   ici depuis les secrets de l'environnement `testflight-build`, décodées
      #   dans $RUNNER_TEMP/eas-environment-secrets/ — nom de dossier imposé :
      #   fingerprint.config.js l'ignore, sinon l'empreinte calculée avant le
      #   build diffère de celle du build (« Runtime version … not equal ») ;
      # - SENTRY_AUTH_TOKEN (secret EAS) : pas d'envoi des source maps
      #   (SENTRY_DISABLE_AUTO_UPLOAD) ; les crashs remontent quand même.
      # Les variables EAS « sensitive » (clés Maps, WAKE_KEY…) sont, elles,
      # chargées par eas-cli en local.
      - name: Build beta (GitHub runner)
        id: ghbuild
        if: inputs.action == 'build' && inputs.builder != 'eas'
        working-directory: apps/client
        timeout-minutes: 100
        env:
          PLATFORM: ${{ matrix.platform }}
          # Seul le fichier de la jambe est transmis à l'étape.
          FIREBASE_B64: >-
            ${{ matrix.platform == 'ios' && secrets.FIREBASE_IOS_PLIST_BETA_B64
            || matrix.platform == 'android' && secrets.FIREBASE_ANDROID_JSON_BETA_B64 || '' }}
          EXPO_PUBLIC_APP_ENV: beta
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: '1'
          # Android : bundletool lit le versionCode DANS le .aab (#480 ; absent
          # de l'image ubuntu-24.04). Jar officiel google/bundletool, vérifié
          # par SHA-256 (empreinte publiée sur la release GitHub). Montée à la
          # main : Dependabot ne suit pas ce téléchargement.
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          # CocoaPods exige une locale UTF-8.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          umask 077
          SECRETS_DIR="$RUNNER_TEMP/eas-environment-secrets"
          rm -rf "$SECRETS_DIR"
          mkdir -p "$SECRETS_DIR"
          trap 'rm -rf "$SECRETS_DIR"' EXIT
          case "$PLATFORM" in
            ios)
              SECRET=FIREBASE_IOS_PLIST_BETA_B64 VAR=GOOGLE_SERVICE_INFO_PLIST_BETA
              FILE="$SECRETS_DIR/GoogleService-Info.beta.plist" OUT="$RUNNER_TEMP/ffd-connect-beta.ipa"
              ;;
            android)
              SECRET=FIREBASE_ANDROID_JSON_BETA_B64 VAR=GOOGLE_SERVICES_JSON_BETA
              FILE="$SECRETS_DIR/google-services.beta.json" OUT="$RUNNER_TEMP/ffd-connect-beta.aab"
              # JDK 17 (React Native 0.86), quel que soit le JDK par défaut.
              export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
              ;;
            *)
              echo "::error::plateforme inattendue : $PLATFORM"
              exit 1
              ;;
          esac
          EXPECTED_ID=fr.ffdanse.connect.beta

          # Config Firebase : jamais affichée. Vérifiée AVANT le build (un
          # build raté consomme un numéro) : format lisible et bonne app — le
          # fichier d'une autre variante donnerait des push mortes en silence.
          if [ -z "$FIREBASE_B64" ]; then
            echo "::error::secret $SECRET absent de l'environnement testflight-build (docs/exploitation/changelog-beta.md, « Build sur runner GitHub »)"
            exit 1
          fi
          if ! printf '%s' "$FIREBASE_B64" | base64 --decode > "$FILE" 2> /dev/null; then
            echo "::error::secret $SECRET : base64 illisible"
            exit 1
          fi
          unset FIREBASE_B64
          if [ "$PLATFORM" = "ios" ]; then
            FOUND_ID=$(plutil -extract BUNDLE_ID raw -o - "$FILE" 2> /dev/null || true)
            if [ "$FOUND_ID" != "$EXPECTED_ID" ]; then
              echo "::error::secret $SECRET : BUNDLE_ID ${FOUND_ID:-illisible}, attendu $EXPECTED_ID"
              exit 1
            fi
          elif ! jq -e --arg p "$EXPECTED_ID" \
            'any(.client[]?; .client_info.android_client_info.package_name == $p)' "$FILE" > /dev/null 2>&1; then
            echo "::error::secret $SECRET : aucun client Android $EXPECTED_ID dans ce google-services.json"
            exit 1
          fi
          export "$VAR=$FILE"

          # bundletool téléchargé et vérifié AVANT le build : après, un échec
          # perdrait un numéro de build (et le binaire, non conservé).
          if [ "$PLATFORM" = "android" ]; then
            BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
            curl -fsSL --retry 3 -o "$BUNDLETOOL" \
              "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
            if [ "$(shasum -a 256 "$BUNDLETOOL" | cut -d ' ' -f 1)" != "$BUNDLETOOL_SHA256" ]; then
              echo "::error::bundletool $BUNDLETOOL_VERSION : empreinte SHA-256 inattendue, build non lancé"
              exit 1
            fi
          fi

          echo "## $PLATFORM_ICON Build $PLATFORM_NAME beta sur runner GitHub (\`eas build --local\`)" >> "$GITHUB_STEP_SUMMARY"
          if ! eas build --local --platform "$PLATFORM" --profile beta --non-interactive \
            --freeze-credentials --output "$OUT" < /dev/null; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "::error::eas build --local a échoué (numéro de build distant consommé : le prochain build prendra le suivant)"
            exit 1
          fi

          # Numéro affiché par le store : lu DANS le binaire, avec contrôle de
          # l'identifiant (Info.plist de l'IPA ; manifeste du .aab via
          # bundletool). Jamais au compteur distant EAS : un build lancé en
          # parallèle hors de ce run l'aurait avancé, et le tag ne décrirait
          # plus le binaire envoyé (#480).
          if [ "$PLATFORM" = "ios" ]; then
            unzip -p "$OUT" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
            BUNDLE=$(plutil -extract CFBundleIdentifier raw -o - "$RUNNER_TEMP/Info.plist" 2> /dev/null || true)
            BUILD_NUMBER=$(plutil -extract CFBundleVersion raw -o - "$RUNNER_TEMP/Info.plist" 2> /dev/null || true)
            rm -f "$RUNNER_TEMP/Info.plist"
            if [ "$BUNDLE" != "$EXPECTED_ID" ]; then
              echo "state=failed" >> "$GITHUB_OUTPUT"
              echo "::error::binaire construit pour ${BUNDLE:-?}, attendu $EXPECTED_ID"
              exit 1
            fi
          else
            dump_manifest() {
              "$JAVA_HOME/bin/java" -jar "$BUNDLETOOL" dump manifest --bundle="$OUT" --xpath="$1" 2> /dev/null \
                | tr -d '[:space:]' || true
            }
            BUNDLE=$(dump_manifest /manifest/@package)
            BUILD_NUMBER=$(dump_manifest /manifest/@android:versionCode)
            if [ "$BUNDLE" != "$EXPECTED_ID" ]; then
              echo "state=failed" >> "$GITHUB_OUTPUT"
              echo "::error::binaire construit pour ${BUNDLE:-? (manifeste du .aab illisible par bundletool)}, attendu $EXPECTED_ID"
              exit 1
            fi
          fi
          SHA256=$(shasum -a 256 "$OUT" | cut -d ' ' -f 1)
          {
            echo "path=$OUT"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::build fini mais numéro de build illisible : binaire non envoyé (il n'est pas conservé), relancer action=build"
            exit 0
          fi
          {
            echo "state=finished"
            echo "number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Build $PLATFORM_NAME beta **$BUILD_NUMBER** terminé — SHA-256 \`$SHA256\`." >> "$GITHUB_STEP_SUMMARY"

      # Après un build réussi seulement (#512) : sauvegarde ce qui a manqué sa
      # clé exacte, derrière le garde-fou « fichier sensible » de l'action.
      - name: Save native build caches (GitHub build)
        if: >-
          inputs.action == 'build' && inputs.builder != 'eas'
          && steps.ghbuild.outcome == 'success'
        uses: ./.github/actions/native-build-cache
        with:
          step: save
          platform: ${{ matrix.platform }}

      # PAS d'artefact du binaire : dépôt PUBLIC, les artefacts y sont
      # téléchargeables par tout compte GitHub, et le binaire embarque les
      # variables EAS « sensitive » (clés Maps, WAKE_KEY…). Seule son empreinte
      # SHA-256 sort du runner (résumé + release). Un envoi raté se refait par
      # un nouveau build.

      - name: Publish OTA update (beta)
        id: ota
        if: inputs.action == 'ota'
        working-directory: apps/client
        # Beta partage l'API + les clés de l'environnement EAS `preview` (Google
        # Maps/Places, Sentry, WAKE_KEY) mais reste la variante beta. Pas de
        # `--environment preview` : il impose aussi EXPO_PUBLIC_APP_ENV=preview,
        # qui l'emporte sur la valeur passée ici (vérifié). L'OTA était alors
        # calculée pour la variante preview : identité fausse, et avec la
        # runtimeVersion `fingerprint`, une empreinte qu'aucun build beta n'a —
        # l'OTA n'aurait atteint personne. On récupère donc les variables dans
        # .env.local (chargé par le bundler, qui ne surcharge jamais une variable
        # déjà posée), sans EXPO_PUBLIC_APP_ENV, et on pose beta nous-mêmes.
        env:
          EXPO_PUBLIC_APP_ENV: beta
        run: |
          set -euo pipefail
          eas env:pull --environment preview --non-interactive --path .env.local
          sed -i '/^EXPO_PUBLIC_APP_ENV=/d' .env.local
          # Bloquant, et AVANT de publier : rien ne build en parallèle ici, une
          # OTA sans build beta compatible est forcément une erreur.
          for p in ios android; do
            RUNTIME=$(eas fingerprint:generate --platform "$p" --json --non-interactive \
              | sed -n '/^{/,$p' | jq -r .hash)
            echo "{\"platform\":\"$p\",\"runtimeVersion\":\"$RUNTIME\"}"
          done | jq -s . > "$RUNNER_TEMP/beta-runtime.json"
          ../../scripts/check-ota-reach.sh beta "$RUNNER_TEMP/beta-runtime.json" --strict
          eas update --branch beta --message "promote staging @ $(git rev-parse --short HEAD)" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Contrôle après coup : l'empreinte publiée est-elle bien celle vérifiée ?
          ../../scripts/check-ota-reach.sh beta "$RUNNER_TEMP/eas-update.json" --strict

      # Tag & GitHub Release : job release-beta (#477), après ce job, à partir
      # de l'état transmis (numéro de build, commit, empreinte, notes). Ce job
      # exécute du code tiers et n'a donc plus contents: write.

      # Envoi au store, avec une attente BORNÉE : la file de soumission EAS
      # (plan gratuit) a déjà retenu une soumission 1 h 56 IN_QUEUE sans log.
      # Au-delà de SUBMIT_WAIT_MIN, l'étape s'arrête en avertissement
      # (state=pending) — la soumission, elle, continue chez EAS. En reprise, on
      # ne soumet PAS deux fois : une soumission FINISHED est acquise, une
      # soumission encore en file est attendue ; seule une soumission absente,
      # ERRORED ou CANCELED est relancée. Android : piste et statut viennent de
      # submit.beta.android (eas.json).
      # EXPO_PUBLIC_APP_ENV=beta : sans lui, app.config.js retombe sur la variante
      # development et la CLI cherche les credentials de fr.ffdanse.connect.dev
      # (cf. scripts/submit-beta.ts).
      # Build sur runner GitHub : pas d'ID EAS, `eas submit --path` téléverse
      # le binaire et EAS l'envoie avec SES clés (comme pour un build cloud :
      # aucune clé de distribution ici). Une seule tentative ; soumission
      # restée en file : action=distribute une fois FINISHED (voir le suivi).
      - name: Submit to store
        id: submit
        if: >-
          !cancelled()
          && (steps.build.outputs.number != '' || steps.resolve.outputs.number != ''
          || steps.ghbuild.outputs.number != '')
        working-directory: apps/client
        timeout-minutes: 35
        env:
          EXPO_PUBLIC_APP_ENV: beta
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_ID: ${{ steps.build.outputs.id || steps.resolve.outputs.id }}
          BINARY_PATH: ${{ steps.ghbuild.outputs.number != '' && steps.ghbuild.outputs.path || '' }}
          BUILD_NUMBER: ${{ steps.ghbuild.outputs.number }}
          SUBMIT_WAIT_MIN: '30'
        run: |
          set -euo pipefail
          # "<id> <status>" de la soumission la plus récente de CE build, "" si
          # aucune. Code 1 si la liste est illisible (≠ « aucune soumission »).
          latest_submission() {
            eas submit:list --platform "$PLATFORM" --limit 50 --json --non-interactive < /dev/null 2> /dev/null \
              | sed -n '/^\[/,$p' \
              | jq -re --arg b "$BUILD_ID" '
                  if type != "array" then error("not an array") else
                    [.[] | select(.submittedBuild.id == $b)] | sort_by(.createdAt) | last
                    | if . == null then "" else "\(.id) \(.status)" end
                  end' 2> /dev/null
          }
          SUB_ID=""
          SUB_STATUS=""
          if [ -n "$BINARY_PATH" ]; then
            # La sortie de `eas submit` porte l'URL de la soumission
            # (…/submissions/<uuid>) ; à défaut, la plus récente créée depuis.
            SINCE=$(date -u +%Y-%m-%dT%H:%M:%S)
            if ! eas submit --platform "$PLATFORM" --profile beta --path "$BINARY_PATH" \
              --non-interactive --no-wait < /dev/null 2>&1 | tee "$RUNNER_TEMP/eas-submit.log"; then
              echo "state=failed" >> "$GITHUB_OUTPUT"
              echo "::error::eas submit --path a échoué : le binaire n'est pas conservé (dépôt public), relancer action=build (le build $BUILD_NUMBER est perdu)"
              exit 1
            fi
            SUB_ID=$(grep -oE 'submissions/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
              "$RUNNER_TEMP/eas-submit.log" | head -n 1 | cut -d / -f 2 || true)
            for _ in 1 2 3 4 5 6; do
              [ -z "$SUB_ID" ] || break
              sleep 10
              SUB_ID=$(eas submit:list --platform "$PLATFORM" --limit 10 --json --non-interactive < /dev/null 2> /dev/null \
                | sed -n '/^\[/,$p' \
                | jq -r --arg t "$SINCE" '[.[] | select(.createdAt >= $t)] | sort_by(.createdAt) | last | .id // empty' \
                  2> /dev/null || true)
            done
            if ! [[ "$SUB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "state=pending" >> "$GITHUB_OUTPUT"
              echo "::warning::soumission du build $BUILD_NUMBER introuvable - vérifier sur expo.dev (eas submit:list -p $PLATFORM) puis, une fois FINISHED : action=distribute build_number=$BUILD_NUMBER"
              exit 0
            fi
          else
            if [ "$ACTION" = "resume" ]; then
              if ! found=$(latest_submission); then
                echo "::error::liste des soumissions EAS illisible : pas de nouvel envoi à l'aveugle (risque de doublon). Relancer la reprise."
                exit 1
              fi
              read -r SUB_ID SUB_STATUS <<< "$found" || true
            fi

            case "$SUB_STATUS" in
              FINISHED)
                echo "Soumission $SUB_ID déjà terminée : rien à renvoyer."
                ;;
              AWAITING_BUILD | IN_QUEUE | IN_PROGRESS)
                echo "Soumission $SUB_ID déjà en cours ($SUB_STATUS) : on l'attend, sans doublon."
                ;;
              *)
                [ -z "$SUB_STATUS" ] || echo "Soumission précédente $SUB_ID terminée en $SUB_STATUS : nouvel envoi."
                OLD_ID="$SUB_ID"
                eas submit --platform "$PLATFORM" --profile beta --id "$BUILD_ID" --non-interactive --no-wait < /dev/null
                SUB_ID=""
                for _ in 1 2 3 4 5 6; do
                  found=$(latest_submission || true)
                  read -r SUB_ID SUB_STATUS <<< "$found" || true
                  if [ -n "$SUB_ID" ] && [ "$SUB_ID" != "$OLD_ID" ]; then break; fi
                  SUB_ID=""
                  sleep 10
                done
                if [ -z "$SUB_ID" ]; then
                  echo "state=pending" >> "$GITHUB_OUTPUT"
                  echo "::warning::soumission créée mais introuvable dans eas submit:list - vérifier sur expo.dev puis reprendre"
                  exit 0
                fi
                ;;
            esac
          fi
          echo "submission=$SUB_ID" >> "$GITHUB_OUTPUT"

          deadline=$(( $(date +%s) + SUBMIT_WAIT_MIN * 60 ))
          while [ "$SUB_STATUS" != "FINISHED" ]; do
            if [ "$SUB_STATUS" = "ERRORED" ] || [ "$SUB_STATUS" = "CANCELED" ]; then
              echo "state=failed" >> "$GITHUB_OUTPUT"
              if [ -n "$BINARY_PATH" ]; then
                echo "::error::soumission $SUB_ID terminée en $SUB_STATUS (logs : eas submit:view $SUB_ID). Si eas submit:retry $SUB_ID n'y fait rien : relancer action=build (le binaire n'est pas conservé)."
              else
                echo "::error::soumission $SUB_ID terminée en $SUB_STATUS (logs : eas submit:view $SUB_ID). La reprise la relancera."
              fi
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "state=pending" >> "$GITHUB_OUTPUT"
              if [ -n "$BINARY_PATH" ]; then RESUME="action=distribute build_number=$BUILD_NUMBER"; else RESUME="action=resume"; fi
              echo "::warning::soumission $SUB_ID toujours ${SUB_STATUS:-illisible} après $SUBMIT_WAIT_MIN min (file EAS) - elle continue chez EAS ; une fois FINISHED, reprendre avec $RESUME"
              echo "⏳ Soumission \`$SUB_ID\` encore **${SUB_STATUS:-illisible}** après $SUBMIT_WAIT_MIN min." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "… soumission $SUB_ID : ${SUB_STATUS:-statut illisible}"
            sleep 60
            # Erreur passagère de la CLI = statut vide, on réessaie au tour suivant.
            SUB_STATUS=$(eas submit:view "$SUB_ID" --json < /dev/null 2> /dev/null \
              | sed -n '/^{/,$p' | jq -r '.status // empty' 2> /dev/null || true)
          done
          echo "state=finished" >> "$GITHUB_OUTPUT"
          echo "📤 Envoyé sur $STORE_NAME (soumission \`$SUB_ID\`)" >> "$GITHUB_STEP_SUMMARY"

      # Filet de l'étape de build (dont le trap efface déjà la config Firebase) :
      # même après un timeout ou une annulation, rien de décodé ni le binaire
      # ne reste sur le runner. Aucun listage : seulement des suppressions.
      - name: Clean up build secrets and binary (GitHub build)
        if: always() && inputs.action == 'build' && inputs.builder != 'eas'
        run: |
          rm -rf "$RUNNER_TEMP/eas-environment-secrets"
          rm -f "$RUNNER_TEMP/ffd-connect-beta.ipa" "$RUNNER_TEMP/ffd-connect-beta.aab" \
            "$RUNNER_TEMP/Info.plist" "$RUNNER_TEMP/eas-submit.log" "$RUNNER_TEMP/bundletool.jar"

      # Passage de relais à release-beta, distribute-beta et au suivi : les
      # sorties d'un job matriciel s'écrasent d'une jambe à l'autre, d'où un
      # artefact PAR JAMBE (beta-state-<platform>, OTA comprise : release-beta
      # la tague aussi). Rien de secret : ID et numéro de build, commit décrit,
      # empreinte du binaire, état de l'envoi, notes testeurs et notes de
      # release. `always()` : même un run annulé ou un job arrivé à son timeout
      # laisse de quoi taguer le build déjà payé et écrire la commande de
      # reprise.
      - name: Save hand-off state (release-beta, distribute-beta, follow-up)
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          BUILD_ID: ${{ steps.build.outputs.id || steps.resolve.outputs.id }}
          BUILD_NUMBER: >-
            ${{ steps.build.outputs.number || steps.ghbuild.outputs.number
            || steps.resolve.outputs.number || steps.local.outputs.number }}
          BUILD_STATE: ${{ steps.build.outputs.state || steps.ghbuild.outputs.state }}
          # github | eas pour action=build (où le binaire a été construit).
          BUILDER: ${{ inputs.action == 'build' && inputs.builder || '' }}
          # Build sur runner GitHub : empreinte du binaire envoyé au store
          # (le binaire lui-même ne quitte pas le runner).
          BINARY_SHA256: ${{ steps.ghbuild.outputs.sha256 }}
          # Ce qui mérite un tag (ex-condition de l'étape Tag) : dès que le
          # build existe (ou que l'OTA est en ligne), AVANT et indépendamment
          # de l'envoi et de la distribution — le binaire est déjà payé, une
          # soumission bloquée (2026-10-06) ne doit pas le laisser sans tag.
          # distribute : seulement si les notes ont été générées.
          RELEASE: >-
            ${{ (steps.build.outputs.number != ''
            || steps.ghbuild.outputs.number != ''
            || steps.resolve.outputs.number != ''
            || (steps.local.outputs.number != '' && steps.notes.outcome == 'success')
            || steps.ota.outcome == 'success') && 'true' || 'false' }}
          # distribute : envoi fait hors CI (étape « Resolve local beta build »),
          # transmis seulement si les notes ont été générées — sinon pas de
          # distribution sans « What to Test ».
          SUBMIT_STATE: >-
            ${{ steps.submit.outputs.state
            || steps.notes.outcome == 'success' && steps.local.outputs.submit_state
            || '' }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/beta-state"
          mkdir -p "$D"
          # Commit décrit (HEAD : pointe de staging, commit du build repris ou
          # du tag du build local) : release-beta pose le tag dessus.
          COMMIT=$(git rev-parse HEAD 2> /dev/null || true)
          # Version marketing de ce commit : distribute-beta la passe à
          # testflight-distribute (--version) pour ne pas viser un homonyme.
          VERSION=$(sed -nE 's/.*version: "([^"]+)", \/\/ x-release-please-version.*/\1/p' apps/client/app.config.js 2> /dev/null || true)
          jq -n \
            --arg platform "$PLATFORM" --arg skip "${SKIP:-false}" \
            --arg build_id "$BUILD_ID" --arg build_number "$BUILD_NUMBER" \
            --arg version "$VERSION" --arg commit "$COMMIT" \
            --arg build_state "$BUILD_STATE" --arg submit "$SUBMIT_STATE" \
            --arg builder "$BUILDER" --arg sha256 "$BINARY_SHA256" --arg release "$RELEASE" \
            '{platform: $platform, skip: ($skip == "true"), build_id: $build_id,
              build_number: $build_number, version: $version, commit: $commit,
              build_state: $build_state, submit_state: $submit, builder: $builder,
              binary_sha256: $sha256, release: ($release == "true")}' > "$D/state.json"
          if [ -f beta-notes.txt ]; then cp beta-notes.txt "$D/beta-notes.txt"; fi
          if [ -f beta-notes.md ]; then cp beta-notes.md "$D/beta-notes.md"; fi

      - name: Upload hand-off state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-state-${{ matrix.platform }}
          path: ${{ runner.temp }}/beta-state/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # ============================================================
  # TAG & RELEASE BÊTA — seul job du flux bêta avec contents: write (#477)
  # Sorti de promote-beta, qui exécute du code tiers (pnpm install, eas-cli,
  # CocoaPods, Gradle, fastlane) : une dépendance compromise ne peut plus
  # pousser de tag, de release ni de contenu. Ici : aucun code tiers — checkout
  # (actions épinglées), git, jq et gh préinstallés sur le runner.
  # Entrée = l'état transmis par promote-beta, DONNÉE NON FIABLE : chaque champ
  # passe un motif ancré avant usage, le commit doit être dans l'historique de
  # staging, et la version vient du dépôt (app.config.js de ce commit), pas de
  # l'état. Pas d'environnement : rien de secret, pas d'approbation de plus.
  # always() : un build fini est tagué même si promote-beta a échoué ensuite
  # (envoi), a été annulé ou a atteint son timeout. Idempotent : une release
  # déjà présente (relance, reprise, build local tagué à la main) est laissée.
  # Tourne avant distribute-beta (needs), comme l'ancienne étape : le tag
  # existe dès la distribution, et sert de base aux notes du run suivant.
  # ============================================================
  release-beta:
    name: >-
      Tag & release ${{ matrix.platform == 'ios' && 'iOS'
      || matrix.platform == 'android' && 'Android' || 'OTA' }}
      (${{ inputs.action }})
    needs: [promote-beta]
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && needs.promote-beta.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Même expression que promote-beta (OTA comprise ; pas d'`include`).
        platform: >-
          ${{ fromJSON(inputs.action == 'ota' && '["ota"]'
          || inputs.platform == 'ios' && '["ios"]'
          || inputs.platform == 'android' && '["android"]'
          || '["ios","android"]') }}
    permissions:
      contents: write
    steps:
      # Pas d'état (jambe échouée avant la fin, approbation refusée) : rien à
      # taguer, et ni checkout ni lecture.
      - name: Download hand-off state
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beta-state-${{ matrix.platform }}
          path: ${{ runner.temp }}/beta-state

      # Historique de staging : contrôle d'ascendance du commit transmis et
      # lecture de sa version. Arbre de travail réduit à un fichier.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: steps.download.outcome == 'success'
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: apps/client/app.config.js
          sparse-checkout-cone-mode: false

      - name: Read hand-off state
        id: state
        if: steps.download.outcome == 'success'
        env:
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/beta-state/state.json"
          if [ ! -f "$S" ]; then
            echo "::notice::aucun état transmis par promote-beta ($PLATFORM) : rien à taguer"
            exit 0
          fi
          # Seules des valeurs validées sortent d'ici ($GITHUB_OUTPUT, log) :
          # [[ =~ ]] ancre sur la chaîne ENTIÈRE (pas de « 26⏎ready=true »).
          field() { jq -r --arg k "$1" '.[$k] // empty | tostring' "$S"; }
          if [ "$(field platform)" != "$PLATFORM" ]; then
            echo "::error::état transmis pour une autre plateforme que $PLATFORM"
            exit 1
          fi
          if [ "$(field skip)" = "true" ] || [ "$(field release)" != "true" ]; then
            echo "Jambe $PLATFORM : rien à taguer (pas de build abouti / OTA non publiée, ou jambe sans objet)."
            exit 0
          fi
          COMMIT=$(field commit)
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit illisible dans l'état transmis"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" HEAD 2> /dev/null; then
            echo "::error::le commit ${COMMIT:0:7} transmis n'est pas dans l'historique de staging"
            exit 1
          fi
          BUILD_NUMBER=""
          if [ "$ACTION" != "ota" ]; then
            BUILD_NUMBER=$(field build_number)
            if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
              echo "::error::numéro de build illisible dans l'état transmis"
              exit 1
            fi
          fi
          # Facultative (build cloud, reprise, build local) : omise si invalide.
          SHA256=$(field binary_sha256)
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || SHA256=""
          # Version lue dans le DÉPÔT, au commit validé — pas dans l'état.
          VERSION=$(git show "$COMMIT:apps/client/app.config.js" \
            | sed -nE 's/.*version: "([^"]+)", \/\/ x-release-please-version.*/\1/p')
          if ! [[ "$VERSION" =~ ^[0-9]{1,4}(\.[0-9]{1,4}){0,3}$ ]]; then
            echo "::error::version introuvable dans apps/client/app.config.js (annotation x-release-please-version)"
            exit 1
          fi
          {
            echo "ready=true"
            echo "commit=$COMMIT"
            echo "build_number=$BUILD_NUMBER"
            echo "sha256=$SHA256"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # Published, not drafted: a draft release does NOT create its tag, and the
      # tag is how we check out what a beta actually contained. `--prerelease`
      # keeps these out of "latest release".
      #
      # Tag = what testers see, same scheme on both stores:
      # `beta-<version>-<ios|android>-<build number>`, the number TestFlight /
      # Play display ("1.0.0 (18)"). An OTA is tagged too: without it the next
      # changelog (built from the last `beta-*` tag) would announce changes
      # testers already received. Idempotent: a resume or a distribute skips it
      # when the release exists (a local build's tag may be created by hand).
      # The notes body is text from the untrusted hand-off: it only ever goes
      # into --notes-file, size-capped, never into a shell command or the log.
      - name: Tag & GitHub Release (beta, prerelease)
        id: tag
        if: steps.state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ steps.state.outputs.commit }}
          BUILD_NUMBER: ${{ steps.state.outputs.build_number }}
          VERSION: ${{ steps.state.outputs.version }}
          BINARY_SHA256: ${{ steps.state.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios) PLATFORM_NAME=iOS STORE_NAME='App Store Connect' ;;
            android) PLATFORM_NAME=Android STORE_NAME='Google Play (closed testing)' ;;
            *) PLATFORM_NAME=OTA STORE_NAME='' ;;
          esac
          if [ "$ACTION" = "ota" ]; then
            TAG="beta-$VERSION-ota-$(date +%Y%m%d)-${SHA:0:7}"
            TITLE="Beta OTA $VERSION — ${SHA:0:7}"
            HEADER="OTA update on the beta channel (iOS and Android), commit ${SHA:0:7}."
          else
            TAG="beta-$VERSION-$PLATFORM-$BUILD_NUMBER"
            TITLE="Beta $PLATFORM_NAME $VERSION ($BUILD_NUMBER)"
            HEADER="$PLATFORM_NAME build $VERSION ($BUILD_NUMBER) — $STORE_NAME, commit ${SHA:0:7}."
            if [ "$ACTION" = "distribute" ]; then
              # Rien ne relie le binaire envoyé à la main à ce commit : le dire.
              HEADER="$HEADER Local build (eas build --local), uploaded by hand: provenance NOT verified by CI (build local, provenance non vérifiée par la CI)."
            fi
            if [ -n "$BINARY_SHA256" ]; then
              # Relie le binaire du store à ce commit et à ce run.
              HEADER="$HEADER Built on a GitHub Actions runner (eas build --local, $RUN_URL); SHA-256 of the submitted binary: \`$BINARY_SHA256\`."
            fi
          fi
          # Tag déjà présent (relance, reprise, tag posé à la main) : il doit
          # désigner le commit validé. Sinon un promote-beta compromis aurait
          # pu réserver d'avance le tag du build suivant sur un vieux commit.
          if OBJ=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2> /dev/null); then
            read -r OBJ_TYPE OBJ_SHA <<< "$OBJ"
            # Tag annoté : déréférencer jusqu'au commit.
            if [ "$OBJ_TYPE" = "tag" ]; then
              OBJ_SHA=$(gh api "repos/$GH_REPO/git/tags/$OBJ_SHA" --jq '.object.sha')
            fi
            if [ "$OBJ_SHA" != "$SHA" ]; then
              echo "::error::le tag $TAG existe déjà sur ${OBJ_SHA:0:7}, pas sur le commit validé ${SHA:0:7} : rien n'est créé, vérifier ce tag"
              exit 1
            fi
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG déjà présente (relance) — rien à faire."
          else
            NOTES="$RUNNER_TEMP/beta-state/beta-notes.md"
            # Fichier ordinaire seulement : un lien symbolique glissé dans
            # l'artefact ferait lire un autre fichier du runner.
            if [ ! -f "$NOTES" ] || [ -L "$NOTES" ]; then
              echo "::error::notes de release absentes de l'état transmis (étape « Generate tester notes » de promote-beta)"
              exit 1
            fi
            # Corps de release GitHub : 125 000 caractères au plus.
            { printf '%s\n\n' "$HEADER"; head -c 100000 "$NOTES"; } > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease \
              --target "$SHA"
          fi
          echo "🏷️ Tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Save release result (follow-up)
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTCOME: ${{ steps.tag.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beta-release"
          jq -n --arg platform "$PLATFORM" --arg outcome "$OUTCOME" \
            '{platform: $platform, tag_outcome: $outcome}' > "$RUNNER_TEMP/beta-release/release.json"

      - name: Upload release result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-release-${{ matrix.platform }}
          path: ${{ runner.temp }}/beta-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # ============================================================
  # DISTRIBUTION BÊTA — 2ᵉ approbation (ADR-0020)
  # Seul job qui touche aux clés de distribution. Séparé de promote-beta pour
  # que le jeton OIDC (id-token: write) ne soit mintable QUE ici : pas de
  # `pnpm install`, pas d'eas-cli, aucun code tiers téléchargé — checkout
  # restreint aux deux scripts, Node seul (Node ≥ 22.18 exécute le TypeScript
  # des scripts nativement, ils n'importent que des modules intégrés).
  # Environnement `testflight-beta` = 2ᵉ relecture humaine, juste avant
  # d'envoyer aux testeurs : « le build est prêt, on l'envoie ? ». Une seule
  # approbation libère les deux jambes (elles attendent ensemble, une fois
  # toutes les jambes de promote-beta terminées). Refuser = rien n'est
  # distribué ; le suivi donne la commande de reprise.
  # Clés : Key Vault `ffd-connect-release-kv` lu par une identité dédiée en
  # lecture seule (credential fédéré limité à l'environnement
  # `testflight-beta`), repli de transition sur les secrets GitHub de
  # l'environnement. Rotation : docs/exploitation/rotation-cles-distribution.md.
  # ============================================================
  distribute-beta:
    name: >-
      Distribution ${{ matrix.platform == 'ios' && 'iOS · TestFlight'
      || 'Android · Google Play' }} (${{ inputs.action }})
    # release-beta d'abord (le tag existe avant la distribution, comme avant
    # #477) ; son échec ne bloque pas la distribution (!cancelled()).
    needs: [promote-beta, release-beta]
    # !cancelled() : une jambe de promote-beta en échec ne bloque pas l'autre.
    # Le test d'événement est indispensable : avec !cancelled(), un job dont
    # le `needs` est sauté tourne quand même (sinon : chaque run CI).
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch'
      && inputs.action != 'ota' && needs.promote-beta.result != 'skipped'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Même expression que promote-beta, sans l'OTA (pas d'`include` : il
        # créerait des jambes en plus).
        platform: >-
          ${{ fromJSON(inputs.platform == 'ios' && '["ios"]'
          || inputs.platform == 'android' && '["android"]'
          || '["ios","android"]') }}
    timeout-minutes: 60
    environment:
      name: testflight-beta
    # id-token: write — jeton OIDC pour lire les clés dans Key Vault ; l'identité
    # Azure n'accepte que le sujet `environment:testflight-beta`.
    permissions:
      contents: read
      id-token: write
    steps:
      # Scripts pris dans le commit du WORKFLOW (github.sha, réf du dispatch),
      # comme le générateur de notes : le workflow leur passe des options
      # (--version) qu'une version plus ancienne, sur staging, refuserait.
      # Même confiance que le workflow lui-même, qui vient de cette réf.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Le strict nécessaire : les deux scripts et la version de Node.
          sparse-checkout: |
            .nvmrc
            scripts/testflight-distribute.ts
            scripts/play-distribute.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download hand-off state
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beta-state-${{ matrix.platform }}
          path: ${{ runner.temp }}/beta-state

      # Ne distribue que si l'envoi au store a abouti (submit_state=finished).
      - name: Read hand-off state
        id: state
        env:
          PLATFORM: ${{ matrix.platform }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/beta-state/state.json"
          not_ready() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
          }
          if [ ! -f "$S" ]; then
            echo "::warning::aucun état transmis par promote-beta ($PLATFORM) : la jambe a échoué avant la fin, voir son log"
            not_ready "état absent"
            exit 0
          fi
          field() { jq -r --arg k "$1" '.[$k] // empty | tostring' "$S"; }
          if [ "$(field skip)" = "true" ]; then
            echo "Jambe $PLATFORM : rien à reprendre (build d'une autre plateforme) — rien à distribuer."
            not_ready "jambe sans objet"
            exit 0
          fi
          # L'état vient d'un job qui exécute du code tiers (pnpm install,
          # eas-cli, CocoaPods, Gradle) : c'est une DONNÉE non fiable. Chaque champ est validé par
          # un motif strict avant toute utilisation ; aucune valeur brute n'est
          # écrite dans $GITHUB_OUTPUT ni dans le log (un saut de ligne y
          # injecterait `ready=true` ou une commande de workflow).
          BUILD_ID=$(field build_id)
          BUILD_NUMBER=$(field build_number)
          SUBMIT_STATE=$(field submit_state)
          # [[ =~ ]] ancre sur la chaîne ENTIÈRE ; grep -x validerait ligne par
          # ligne et laisserait passer « pending⏎ready=true ».
          if ! [[ "$BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            BUILD_ID=""
          fi
          if ! [[ "$SUBMIT_STATE" =~ ^[a-z_]{1,20}$ ]]; then
            SUBMIT_STATE="invalide"
          fi
          if [ "$SUBMIT_STATE" != "finished" ]; then
            if [ -n "$BUILD_ID" ]; then
              echo "::warning::envoi au store non abouti (${SUBMIT_STATE:-non tenté}) : distribution $PLATFORM différée - reprendre : gh workflow run eas-build.yml --ref $REF -f action=resume -f platform=$PLATFORM -f build_id=$BUILD_ID"
            fi
            not_ready "envoi ${SUBMIT_STATE:-non tenté}"
            exit 0
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::numéro de build illisible dans l'état transmis"
            not_ready "numéro de build illisible"
            exit 1
          fi
          # Version marketing : facultative (état d'un ancien run), mais
          # jamais transmise si elle n'a pas la forme x.y.z.
          VERSION=$(field version)
          if ! [[ "$VERSION" =~ ^[0-9]{1,4}(\.[0-9]{1,4}){0,3}$ ]]; then
            VERSION=""
          fi
          {
            echo "ready=true"
            echo "build_number=$BUILD_NUMBER"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # Connexion juste avant la lecture des clés. Transition : sans la
      # variable AZURE_RELEASE_KEYS_CLIENT_ID, ou si la connexion échoue,
      # l'étape suivante retombe sur les secrets GitHub (avertissement).
      - name: Azure login (release keys)
        id: azlogin
        if: >-
          steps.state.outputs.ready == 'true'
          && vars.AZURE_RELEASE_KEYS_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_RELEASE_KEYS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # L'identité n'a aucun rôle ARM (seulement Key Vault Secrets User sur
          # le coffre) : les appels Key Vault sont du plan de données.
          allow-no-subscriptions: true

      # UNE étape lit les clés, distribue, puis efface tout :
      # - valeurs dans des fichiers $RUNNER_TEMP (umask 077), jamais sur la
      #   sortie du log ni dans $GITHUB_ENV ; chaque ligne masquée AVANT tout
      #   autre usage (JSON Play : chaque valeur et chaque ligne de private_key
      #   aussi) ;
      # - clés passées au seul processus `node` (préfixe d'affectation bash :
      #   environnement du processus, pas sa ligne de commande) ;
      # - `az logout` dès les clés lues, et trap EXIT : fichiers supprimés et
      #   session Azure fermée quoi qu'il arrive.
      # Tout-ou-rien par jambe : un mélange coffre / GitHub pendant une rotation
      # associerait un Key ID et un .p8 qui ne vont pas ensemble.
      # Distribution, même rôle sur les deux stores :
      # - iOS : groupe EXTERNE « Beta FFD », « What to Test », Beta App Review
      #   (API App Store Connect, `eas submit --groups` ne vise que l'interne) ;
      # - Android : notes de version (fr-FR, 500 car.) sur la piste de test
      #   fermé (API Google Play). Sans la clé du compte de service, l'étape
      #   avertit et passe : le build reste publié.
      # Idempotent. --timeout borne l'attente côté store, sous celle de l'étape.
      - name: Distribute to testers (keys loaded in this step only)
        id: distribute
        if: steps.state.outputs.ready == 'true'
        timeout-minutes: 50
        env:
          PLATFORM: ${{ matrix.platform }}
          KV_NAME: ffd-connect-release-kv
          LOGIN_OUTCOME: ${{ steps.azlogin.outcome }}
          BUILD_NUMBER: ${{ steps.state.outputs.build_number }}
          APP_VERSION: ${{ steps.state.outputs.version }}
          ASC_APP_ID: '6787383066'
          # Repli de transition (à supprimer une fois le coffre éprouvé) :
          # visibles de cette seule étape, effacés de son environnement avant
          # le lancement du script.
          GH_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          GH_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GH_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GH_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          DIR=$(mktemp -d "$RUNNER_TEMP/release-keys.XXXXXX")
          cleanup() {
            rm -rf "$DIR"
            az logout > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          NOTES_FILE="$RUNNER_TEMP/beta-state/beta-notes.txt"
          case "$PLATFORM" in
            ios) VARS=(ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8) ;;
            android) VARS=(PLAY_SERVICE_ACCOUNT_JSON) ;;
            *)
              echo "::error::plateforme inattendue : $PLATFORM"
              exit 1
              ;;
          esac
          # ASC_KEY_P8 -> asc-key-p8
          kv_name() { printf '%s' "$1" | tr 'A-Z_' 'a-z-'; }
          mask_lines() {
            local line
            while IFS= read -r line || [ -n "$line" ]; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done
          }
          # Chaque ligne du fichier ; pour le JSON Play, en plus chaque valeur
          # texte (client_email, private_key_id…) et chaque ligne de la clé
          # privée décodée (le fichier, lui, la porte sur une ligne avec des
          # « \n » échappés). Erreurs de jq muettes : jamais de contenu au log.
          mask_file() {
            mask_lines < "$1"
            if [ "$2" = "PLAY_SERVICE_ACCOUNT_JSON" ] && [ -s "$1" ]; then
              { jq -r '.. | strings' "$1" 2> /dev/null || true; } | mask_lines
              { jq -r '.private_key // empty' "$1" 2> /dev/null || true; } | mask_lines
            fi
          }

          SOURCE=keyvault
          REASON=""
          if [ "$LOGIN_OUTCOME" != "success" ]; then
            SOURCE=github
            REASON="connexion Azure ${LOGIN_OUTCOME:-non tentée} (variable AZURE_RELEASE_KEYS_CLIENT_ID posée sur l'environnement ?)"
          else
            for v in "${VARS[@]}"; do
              f="$DIR/$v"
              # JSON + jq -r : restitue fidèlement une valeur multi-ligne (.p8).
              if ! az keyvault secret show --vault-name "$KV_NAME" --name "$(kv_name "$v")" \
                --query value -o json 2> "$DIR/err" | jq -er . > "$f" 2>> "$DIR/err"; then
                : > "$f"
              fi
              mask_file "$f" "$v"
              if [ ! -s "$f" ] || ! grep -q '[^[:space:]]' "$f"; then
                SOURCE=github
                # Le message d'erreur d'az (SecretNotFound, Forbidden…) ne
                # contient jamais la valeur.
                REASON="secret $(kv_name "$v") absent, vide ou illisible dans $KV_NAME ($(head -n 1 "$DIR/err" | cut -c1-200))"
                break
              fi
            done
          fi
          # Plus besoin de la session Azure : fermée AVANT de lancer le script.
          az logout > /dev/null 2>&1 || true

          if [ "$SOURCE" = "github" ]; then
            echo "::warning::clés de distribution lues depuis les secrets GitHub (repli de transition) : $REASON"
            for v in "${VARS[@]}"; do
              gh_var="GH_$v"
              printf '%s' "${!gh_var}" > "$DIR/$v"
              mask_file "$DIR/$v" "$v"
            done
          fi
          unset GH_ASC_KEY_ID GH_ASC_ISSUER_ID GH_ASC_KEY_P8 GH_PLAY_SERVICE_ACCOUNT_JSON
          echo "🔑 Clés de distribution : **$SOURCE**${REASON:+ ($REASON)}" >> "$GITHUB_STEP_SUMMARY"

          # $(< f) retire les fins de ligne finales : un Key ID suivi d'un
          # « \n » casserait le JWT App Store Connect.
          if [ "$PLATFORM" = "ios" ]; then
            VERSION_ARGS=()
            if [ -n "$APP_VERSION" ]; then VERSION_ARGS=(--version "$APP_VERSION"); fi
            ASC_KEY_ID="$(< "$DIR/ASC_KEY_ID")" \
              ASC_ISSUER_ID="$(< "$DIR/ASC_ISSUER_ID")" \
              ASC_KEY_P8="$(< "$DIR/ASC_KEY_P8")" \
              node scripts/testflight-distribute.ts \
              --build-number "$BUILD_NUMBER" "${VERSION_ARGS[@]}" --notes-file "$NOTES_FILE" --timeout 45
            echo "✅ Build iOS $BUILD_NUMBER : « What to Test », groupe « Beta FFD », Beta App Review" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -s "$DIR/PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON absent (Key Vault et secrets GitHub) : build Android $BUILD_NUMBER publié sans notes de version"
            echo "⚠️ Build Android $BUILD_NUMBER publié **sans notes de version** (clé PLAY_SERVICE_ACCOUNT_JSON absente)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            PLAY_SERVICE_ACCOUNT_JSON="$(< "$DIR/PLAY_SERVICE_ACCOUNT_JSON")" \
              node scripts/play-distribute.ts \
              --version-code "$BUILD_NUMBER" --notes-file "$NOTES_FILE" --timeout 45
            echo "✅ Build Android $BUILD_NUMBER : notes de version sur la piste de test fermé" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save distribution result (follow-up)
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          READY: ${{ steps.state.outputs.ready }}
          REASON: ${{ steps.state.outputs.reason }}
          OUTCOME: ${{ steps.distribute.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beta-dist"
          jq -n --arg platform "$PLATFORM" --arg ready "$READY" --arg reason "$REASON" --arg outcome "$OUTCOME" \
            '{platform: $platform, ready: ($ready == "true"), reason: $reason, outcome: $outcome}' \
            > "$RUNNER_TEMP/beta-dist/dist.json"

      - name: Upload distribution result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-dist-${{ matrix.platform }}
          path: ${{ runner.temp }}/beta-dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # ============================================================
  # SUIVI BÊTA — état final des deux jobs, commande de reprise si incomplet.
  # Job à part : une distribution REFUSÉE (2ᵉ approbation) ne lance aucune
  # étape de distribute-beta, seul un job en aval peut le dire. always() : il
  # tourne aussi après un refus ou une annulation (c'est là qu'on a besoin de
  # la commande de reprise, 0 $, aucun rebuild).
  # ============================================================
  beta-follow-up:
    name: Bêta — suivi (reprise si incomplet)
    needs: [promote-beta, release-beta, distribute-beta]
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && inputs.action != 'ota' && needs.promote-beta.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download hand-off states
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beta-state-*
          path: ${{ runner.temp }}/state

      - name: Download release results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beta-release-*
          path: ${{ runner.temp }}/release

      - name: Download distribution results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beta-dist-*
          path: ${{ runner.temp }}/dist

      - name: Follow-up (resume command if incomplete)
        env:
          DISTRIBUTE_RESULT: ${{ needs.distribute-beta.result }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for PLATFORM in ios android; do
            S="$RUNNER_TEMP/state/beta-state-$PLATFORM/state.json"
            D="$RUNNER_TEMP/dist/beta-dist-$PLATFORM/dist.json"
            T="$RUNNER_TEMP/release/beta-release-$PLATFORM/release.json"
            [ -f "$S" ] || continue # jambe non lancée, ou échouée avant tout build
            sf() { jq -r --arg k "$1" '.[$k] // empty | tostring' "$S"; }
            [ "$(sf skip)" != "true" ] || continue # resume : jambe de l'autre plateforme
            BUILD_ID=$(sf build_id)
            BUILD_NUMBER=$(sf build_number)
            BUILD_STATE=$(sf build_state)
            # Tag & release : posés par release-beta (#477), absent = non lancé.
            TAG_OUTCOME=""
            if [ -f "$T" ]; then TAG_OUTCOME=$(jq -r '.tag_outcome // empty | tostring' "$T"); fi
            SUBMIT_STATE=$(sf submit_state)
            BUILDER=$(sf builder)
            # État venu d'un job non fiable : chaque champ affiché ou recopié
            # dans une commande passe un motif strict (comme distribute-beta) ;
            # un saut de ligne injecterait sinon une commande de workflow.
            if ! [[ "$BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              BUILD_ID=""
            fi
            [[ "$BUILDER" =~ ^(github|eas)$ ]] || BUILDER=""
            for v in BUILD_STATE TAG_OUTCOME SUBMIT_STATE; do
              if [ -n "${!v}" ] && ! [[ "${!v}" =~ ^[a-z_]{1,20}$ ]]; then
                printf -v "$v" '%s' invalide
              fi
            done
            if [ -n "$BUILD_ID" ]; then
              CMD="gh workflow run eas-build.yml --ref $REF -f action=resume -f platform=$PLATFORM -f build_id=$BUILD_ID"
              BUILD_LABEL="${BUILD_STATE:-repris}"
            elif [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
              # distribute : build local, sans ID EAS — on le reprend par son
              # numéro (validé : l'état vient d'un job non fiable).
              CMD="gh workflow run eas-build.yml --ref $REF -f action=distribute -f platform=$PLATFORM -f build_number=$BUILD_NUMBER"
              BUILD_LABEL="local (hors EAS)"
              if [ "$BUILDER" = "github" ]; then
                BUILD_LABEL="runner GitHub"
              fi
            else
              continue # rien n'a été construit ni repris : l'erreur est dans l'étape fautive
            fi
            if [ "$BUILD_STATE" = "failed" ]; then
              echo "::error::le build $PLATFORM $BUILD_ID a échoué chez EAS : un nouveau build (action=build) est nécessaire"
              continue
            fi
            # Build sur runner dont l'envoi n'a pas abouti : action=distribute
            # suppose le binaire déjà sur le store, et le binaire n'est pas
            # conservé (dépôt public). Soumission en file (pending) : attendre
            # puis $CMD ; sinon (échec), seul un nouveau build reste possible.
            if [ "$BUILDER" = "github" ] && [ "$SUBMIT_STATE" != "finished" ] && [ "$SUBMIT_STATE" != "pending" ]; then
              echo "::error::build $PLATFORM $BUILD_NUMBER construit sur le runner mais pas envoyé au store (${SUBMIT_STATE:-non tenté}) : binaire non conservé, relancer action=build"
              continue
            fi
            if [ -f "$D" ]; then
              DIST=$(jq -r 'if .ready then .outcome else "différée : \(.reason)" end' "$D")
            else
              DIST="non approuvée ou non lancée (distribute-beta : ${DISTRIBUTE_RESULT:-?})"
            fi
            if [ "$TAG_OUTCOME" = "success" ] && [ "$SUBMIT_STATE" = "finished" ] && [ "$DIST" = "success" ]; then
              echo "✅ Promotion $PLATFORM complète." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "::warning::promotion $PLATFORM incomplète (tag=${TAG_OUTCOME:-skipped} submit=${SUBMIT_STATE:-skipped} distribution=$DIST) - reprendre SANS rebuild : $CMD"
            {
              echo "## ⚠️ Promotion $PLATFORM incomplète — reprise sans rebuild (0 \$)"
              echo
              echo "| Étape | État |"
              echo "| --- | --- |"
              echo "| Build | $BUILD_LABEL |"
              echo "| Tag & Release | ${TAG_OUTCOME:-skipped} |"
              echo "| Envoi au store | ${SUBMIT_STATE:-skipped} |"
              echo "| Distribution (2ᵉ approbation) | $DIST |"
              echo
              echo "Une fois le build FINISHED / la soumission sortie de la file EAS (\`eas submit:list -p $PLATFORM\`) :"
              echo
              echo '```bash'
              echo "$CMD"
              echo '```'
              echo
              echo "Ou Actions → EAS Build & Update → Run workflow avec les valeurs de la commande ci-dessus. La reprise redemande les deux approbations."
            } >> "$GITHUB_STEP_SUMMARY"
          done

  # ============================================================
  # MASTER — Production (réservé au lancement App Store public).
  # Full build only if native changes, OTA always.
  # ============================================================
  build-production:
    name: >-
      EAS Build (production${{ matrix.platform != 'eas' && format(' · {0}', matrix.platform) || '' }})
    needs: [gate]
    if: |
      needs.gate.outputs.branch == 'master'
      && needs.gate.outputs.client_changed == 'true'
      && needs.gate.outputs.native == 'true'
    # Builder (#508): GitHub runner by default (`eas build --local`, iOS on
    # macos-26 with Xcode pinned, Android on Ubuntu), outside the EAS build
    # quota and free on a public repository. One matrix leg per platform the
    # gate found without a build of the current fingerprint. Fallback: the
    # repository variable NATIVE_BUILDER=eas replaces the legs by a single
    # `eas build` in the EAS cloud (quota of the free plan), as before #508.
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(vars.NATIVE_BUILDER == 'eas' && '["eas"]'
          || needs.gate.outputs.build_platforms) }}
    # Runner build: ~35-45 min on macOS, ~25-35 min on Ubuntu (beta measures).
    # EAS cloud: submits without --wait, ~8-10 min.
    # The cap does not count the time spent waiting for the reviewer.
    timeout-minutes: 120
    # Same gate as ota-production: required reviewer (owner). Never removed.
    # Holds the production Firebase configs read by the runner build.
    environment:
      name: app-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # No token in .git/config: `eas build` archives the project.
          persist-credentials: false

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      # NATIVE_BUILDER=eas fallback. Only the platforms the gate found without
      # a build of the current fingerprint; every AUTO_BUILD_PLATFORMS entry
      # when it fell back.
      - name: Build production (EAS cloud)
        if: matrix.platform == 'eas'
        working-directory: apps/client
        env:
          NATIVE_PLATFORMS: ${{ needs.gate.outputs.native_platforms }}
        run: |
          set -euo pipefail
          # Unquoted on purpose (word splitting, globbing off): list -> "$@".
          set -f
          # shellcheck disable=SC2086
          set -- ${NATIVE_PLATFORMS:-$AUTO_BUILD_PLATFORMS}
          ios=false
          android=false
          for p in "$@"; do
            case "$p" in
              ios) ios=true ;;
              android) android=true ;;
              *) echo "::error::unknown platform '$p'"; exit 1 ;;
            esac
          done
          # `all` only when BOTH are listed: duplicates must not add Android.
          if [ "$ios" = true ] && [ "$android" = true ]; then PLATFORM=all
          elif [ "$ios" = true ]; then PLATFORM=ios
          elif [ "$android" = true ]; then PLATFORM=android
          else echo "::error::no platform to build"; exit 1
          fi
          echo "Building production in the EAS cloud for: $* (--platform $PLATFORM)" | tee -a "$GITHUB_STEP_SUMMARY"
          eas build --profile production --platform "$PLATFORM" --non-interactive

      # Same path as the beta promotion (promote-beta, builder=github): Firebase
      # config from this job's GitHub environment secrets, credentials frozen,
      # no Sentry source map upload. The binary never leaves the runner except
      # to EAS (next step): no GitHub artifact, the repository is public.
      - name: Build production (GitHub runner)
        id: build
        if: matrix.platform != 'eas'
        timeout-minutes: 100
        uses: ./.github/actions/eas-local-build
        with:
          platform: ${{ matrix.platform }}
          profile: production
          firebase-b64: >-
            ${{ matrix.platform == 'ios' && secrets.FIREBASE_IOS_PLIST_PRODUCTION_B64
            || secrets.FIREBASE_ANDROID_JSON_PRODUCTION_B64 }}
          firebase-secret-name: >-
            ${{ matrix.platform == 'ios' && 'FIREBASE_IOS_PLIST_PRODUCTION_B64'
            || 'FIREBASE_ANDROID_JSON_PRODUCTION_B64' }}

      # `eas upload` registers the local binary on expo.dev: install link /
      # download from the project's build page (Expo account members only), and
      # an EAS record carrying its fingerprint, which the gate and
      # check-ota-reach.sh look up (eas build:list --fingerprint-hash). It
      # stores a file, it runs no build: not counted in the EAS build quota.
      - name: Upload to EAS (eas upload)
        if: matrix.platform != 'eas'
        working-directory: apps/client
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_PATH: ${{ steps.build.outputs.path }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
        run: |
          set -euo pipefail
          trap 'rm -f "$BUILD_PATH"' EXIT
          args=(--platform "$PLATFORM" --build-path "$BUILD_PATH" --non-interactive --json)
          if [ -n "$FINGERPRINT" ]; then
            args+=(--fingerprint "$FINGERPRINT")
          fi
          if ! out=$(eas upload "${args[@]}" < /dev/null); then
            echo "::error::eas upload a échoué : binaire perdu (non conservé), le prochain push le reconstruira"
            exit 1
          fi
          url=$(sed -n '/^{/,$p' <<< "$out" | jq -r '.url // empty' 2> /dev/null || true)
          echo "📦 Binaire production $PLATFORM envoyé sur EAS : ${url:-voir expo.dev}" | tee -a "$GITHUB_STEP_SUMMARY"

  ota-production:
    name: OTA Update (production)
    needs: [gate]
    if: needs.gate.outputs.branch == 'master' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice (reviewer wait not counted).
    timeout-minutes: 20
    # Sharpest automatic path in the repo: this ships JavaScript straight to
    # production app users on any master push that touches the client, with no
    # store review in between. `app-production` carries a required reviewer.
    environment:
      name: app-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment production : embarque l'URL API prod dans le bundle OTA.
        run: |
          set -euo pipefail
          eas update --branch production --environment production --message "$COMMIT_MSG" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Avertit seulement : build-production tourne peut-être en parallèle.
          ../../scripts/check-ota-reach.sh production "$RUNNER_TEMP/eas-update.json"
