# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: EAS Build & Update

on:
  # Triggered after CI passes (not directly on push).
  # NOTE: Manual CI re-runs also trigger this workflow. The gate job
  # checks client_changed via git diff, so a re-run of CI without new
  # client changes will skip all EAS jobs. Verified safe.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master, staging, develop]
  # Manual promotion of the current staging code to the TestFlight beta
  # channel, once validated on the personal ad-hoc preview channel.
  workflow_dispatch:
    inputs:
      action:
        description: 'Promote staging → TestFlight beta'
        required: true
        type: choice
        options:
          - ota
          - build
      releaseNotes:
        description: >-
          Notes testeurs (relecture). Laisser VIDE = génération auto depuis les
          commits conventionnels depuis le dernier tag beta-*.
        required: false
        type: string

permissions: read-all

concurrency:
  group: eas-${{ github.event.workflow_run.head_branch || 'manual-beta' }}
  # A newer push supersedes an older one, but a manual promotion must never be
  # cancelled by a second dispatch: promote-beta waits on a native build that is
  # already paid for (~2 USD) and would leave it without submit/tag/distribution.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # ============================================================
  # GATE — Only proceed if CI passed and client code changed
  # ============================================================
  gate:
    name: Check CI result & changes
    runs-on: ubuntu-24.04
    # Workspace install + fingerprint + a few EAS API calls: ~3-4 min.
    timeout-minutes: 15
    # Only a PUSH to this repository may deploy. workflow_run's `branches` filter
    # matches the head branch NAME only: on a public repo a fork PR from a branch
    # named `staging` would otherwise run here with secrets + Azure OIDC on the
    # fork's code (head_sha). Also stops promotion PRs (head = staging) re-deploying.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      # The fingerprint decision when it could be made, else the path-based one.
      native: ${{ steps.fingerprint.outputs.native || steps.check.outputs.native }}
      client_changed: ${{ steps.check.outputs.client_changed }}
      branch: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect change type
        id: check
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Cascade pushes (develop -> staging -> master) are merge commits: the
          # first parent is the branch's previous tip, so HEAD^1..HEAD is exactly
          # the cumulative promoted change. A native EAS build costs ~2 $, so only
          # force one when that diff cannot be trusted (fast-forward or direct
          # push = no merge commit).
          if [ "$BRANCH" = "staging" ] || [ "$BRANCH" = "master" ]; then
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -lt 3 ]; then
              echo "Cascade push to $BRANCH without a merge commit - forcing full build"
              echo "client_changed=true" >> "$GITHUB_OUTPUT"
              echo "native=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            COMPARE_SHA=$(git rev-parse HEAD^1)
          else
            # Develop: compare against the previous push (last 2 commits)
            COMPARE_SHA=$(git log --first-parent -2 --format='%H' HEAD | tail -1)
          fi

          if [ -z "$COMPARE_SHA" ]; then
            echo "No comparison base found - assuming everything changed"
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$COMPARE_SHA" HEAD)
          echo "Comparing $COMPARE_SHA..HEAD (branch: $BRANCH)"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any client-related files changed
          CLIENT_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -qE "^(apps/client/|packages/shared/|pnpm-lock\.yaml)"; then
            CLIENT_CHANGED="true"
          fi
          echo "client_changed=$CLIENT_CHANGED" >> "$GITHUB_OUTPUT"

          # Path-based guess at whether a native build is needed. Only a
          # FALLBACK on staging/master: the fingerprint step below replaces it
          # whenever it can compute an answer. Deliberately conservative, since
          # it only runs when that answer is unavailable.
          NATIVE="false"
          # .easignore is not "native", but it decides WHAT REACHES EAS, so a
          # change to it can break a build that an OTA would never exercise.
          # It did on 2026-10-05: excluding apps/backend/ dropped swagger.json,
          # the client SDK was never generated and Metro failed to resolve it.
          # The fix then shipped with no native build to prove it, because this
          # very list did not mention the file.
          NATIVE_PATTERNS="^(apps/client/app\.config|apps/client/app\.json|apps/client/eas\.json|apps/client/package\.json|apps/client/\.easignore|apps/client/fingerprint\.config\.js|apps/client/openapi-ts\.config|apps/client/(ios|android|plugins|modules)/|patches/|pnpm-lock\.yaml)"
          if echo "$CHANGED_FILES" | grep -qE "$NATIVE_PATTERNS"; then
            NATIVE="true"
          fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "Result: client_changed=$CLIENT_CHANGED native(paths)=$NATIVE"

      # ------------------------------------------------------------------
      # Native build decision by fingerprint (staging/master only).
      # runtimeVersion is { policy: "fingerprint" } (app.config.js): an OTA
      # reaches exactly the binaries whose runtimeVersion equals the project
      # fingerprint. So a native build (~2 USD) is needed iff no build of the
      # target profile already carries that runtimeVersion. The path list above
      # over-triggered: every lockfile or package.json bump (Dependabot, a
      # JS-only dependency) paid for a build that changed nothing native.
      # Any failure (no fingerprint policy on that commit, EAS unreachable)
      # falls back to the path-based decision: never silently skip a build.
      # ------------------------------------------------------------------
      - name: Setup pnpm & Node (fingerprint)
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI (fingerprint)
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decide native build by fingerprint
        id: fingerprint
        if: >-
          (github.event.workflow_run.head_branch == 'staging'
          || github.event.workflow_run.head_branch == 'master')
          && steps.check.outputs.client_changed == 'true'
        working-directory: apps/client
        # Inline on purpose: workflow_run runs THIS file from the default branch
        # against the pushed commit (head_sha), which may predate any script
        # added alongside this logic.
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PATH_NATIVE: ${{ steps.check.outputs.native }}
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          fallback() {
            echo "::warning::$1 - falling back to the path-based decision (native=$PATH_NATIVE)"
            echo "native=$PATH_NATIVE" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Before { policy: "fingerprint" } (static runtimeVersion "2.5.0"),
          # runtimeVersion is not the fingerprint and this check means nothing.
          if ! grep -qE 'runtimeVersion:[[:space:]]*\{[[:space:]]*policy:[[:space:]]*"fingerprint"' app.config.js; then
            fallback "runtimeVersion is not fingerprint-based on this commit"
          fi

          # Profile == channel for both (eas.json). iOS only: Android builds are
          # disabled during the MVP beta (see build-staging / build-production).
          case "$BRANCH" in
            staging) PROFILE=preview ;;
            master) PROFILE=production ;;
            *) fallback "no build profile for branch $BRANCH" ;;
          esac

          # --build-profile applies the profile's env (EXPO_PUBLIC_APP_ENV…),
          # which the fingerprint depends on: same hash `eas build` computes.
          HASH=$(eas fingerprint:generate --build-profile "$PROFILE" --platform ios --json --non-interactive \
            < /dev/null 2> /dev/null | sed -n '/^{/,$p' | jq -r '.hash // empty' 2> /dev/null)
          [ -n "$HASH" ] || fallback "could not compute the $PROFILE fingerprint"
          echo "Fingerprint ($PROFILE, ios): $HASH"

          # A build already queued or running for the same fingerprint (a
          # previous push) counts too: do not pay twice for the same binary.
          for status in finished in-progress in-queue new; do
            count=$(eas build:list --channel "$PROFILE" --build-profile "$PROFILE" --platform ios \
              --status "$status" --runtime-version "$HASH" --limit 1 --json --non-interactive \
              < /dev/null 2> /dev/null | sed -n '/^[[{]/,$p' | jq 'length' 2> /dev/null)
            [ -n "$count" ] || fallback "could not list EAS builds"
            if [ "$count" -gt 0 ]; then
              echo "native=false" >> "$GITHUB_OUTPUT"
              echo "A $status \`$PROFILE\` build already has runtime ${HASH:0:7}: OTA only, no native build." | tee -a "$summary"
              exit 0
            fi
          done
          echo "native=true" >> "$GITHUB_OUTPUT"
          echo "No \`$PROFILE\` build has runtime ${HASH:0:7}: native build needed (~2 USD)." | tee -a "$summary"

  # ============================================================
  # DEVELOP — OTA only (devs rebuild dev client manually for
  # native changes)
  # ============================================================
  ota-development:
    name: OTA Update (development)
    needs: [gate]
    if: needs.gate.outputs.branch == 'develop' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment injecte les vars EAS server (EXPO_PUBLIC_API_URL…) dans
        # le bundle. Sans lui, l'URL API est vide → "Network Error" au login.
        # Pas de check-ota-reach : les profils dev client n'ont pas de canal dans
        # eas.json et se rebuildent à la main, le contrôle avertirait toujours.
        run: eas update --branch development --environment development --message "$COMMIT_MSG"

  # ============================================================
  # STAGING — Full build only if native changes, OTA always
  # ============================================================
  build-staging:
    name: EAS Build (preview)
    needs: [gate]
    if: |
      needs.gate.outputs.branch == 'staging'
      && needs.gate.outputs.client_changed == 'true'
      && needs.gate.outputs.native == 'true'
    runs-on: ubuntu-24.04
    # Submits without --wait: ~8-10 min in practice (install + archive upload).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview (iOS only — Android disabled during MVP beta)
        working-directory: apps/client
        run: eas build --profile preview --platform ios --non-interactive

  ota-staging:
    name: OTA Update (preview)
    needs: [gate]
    if: needs.gate.outputs.branch == 'staging' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice.
    timeout-minutes: 20
    # Record only, no reviewer — this is the internal preview channel.
    environment:
      name: preview

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment preview : sans lui l'URL API n'est pas embarquée dans le
        # bundle OTA (les env de eas.json ne valent que pour `eas build`), d'où
        # "Network Error" au login sur la preview après une promotion.
        run: |
          set -euo pipefail
          eas update --branch preview --environment preview --message "$COMMIT_MSG" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Avertit seulement : build-staging tourne peut-être en parallèle.
          ../../scripts/check-ota-reach.sh preview "$RUNNER_TEMP/eas-update.json"

  # ============================================================
  # PROMOTION MANUELLE — staging → TestFlight beta
  # beta = variante distincte (FFD Connect Beta, bundle .beta, API staging),
  # distribuée via TestFlight. Bundle id propre → coexiste avec l'app ad-hoc
  # preview (.staging) et la prod sur un même appareil ; même code/API que
  # preview, seule la distribution (store) et l'identité de l'app diffèrent.
  # Déclenché à la main (workflow_dispatch) une fois la version
  # validée sur le canal preview :
  #   - ota   → publie le JS courant de staging sur le canal beta
  #   - build → build natif iOS `beta` (attendu), `eas submit` vers App Store
  #             Connect, puis scripts/testflight-distribute.ts : groupe
  #             TestFlight EXTERNE « Beta FFD » + « What to Test » + soumission
  #             Beta App Review, via l'API App Store Connect. Fonctionne en plan
  #             EAS gratuit (le job `testflight` des EAS Workflows exige un plan
  #             payant). Le job attend ~1 h (build + traitement Apple) : minutes
  #             Actions gratuites, le repo est public.
  #             Secrets requis, dans l'environnement `testflight-beta` (pas au
  #             niveau du repo : relecteur obligatoire + branches restreintes) :
  #             ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (clé API App Store Connect,
  #             rôle App Manager).
  # ============================================================
  promote-beta:
    name: Promote staging → TestFlight beta (${{ inputs.action }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Build EAS (~20-30 min) + traitement Apple (jusqu'à 30 min) + marge.
    timeout-minutes: 120
    # The environment carries the deployment record (what went to TestFlight,
    # when, from which SHA), a required reviewer, and the ASC_* secrets.
    environment:
      name: testflight-beta
    # Nécessaire pour créer la GitHub Release (changelog testeurs).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: staging
          # Historique complet + tags : le générateur remonte au dernier tag beta-*.
          fetch-depth: 0
          # Pas de token dans .git/config : `eas build` archive le projet, et
          # l'étape GitHub Release passe GH_TOKEN explicitement.
          persist-credentials: false

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Changelog testeurs : notes fournies (relecture) OU génération auto depuis
      # les commits conventionnels depuis le dernier tag beta-*.
      - name: Generate beta changelog
        id: changelog
        # Notes passées via env (pas d'interpolation dans le shell → pas
        # d'injection de commande depuis le champ du formulaire).
        env:
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > beta-notes.md
            cp beta-notes.md beta-notes.txt
          else
            node scripts/generate-changelog.mjs --format markdown > beta-notes.md
            node scripts/generate-changelog.mjs --format testflight > beta-notes.txt
          fi
          {
            echo '## 📝 Notes testeurs (TestFlight « What to Test »)'
            echo '```'
            cat beta-notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-changelog
          path: |
            beta-notes.md
            beta-notes.txt

      # Build natif iOS `beta`, en attendant la fin : le numéro de build est
      # nécessaire pour retrouver le binaire côté App Store Connect. Sortie JSON
      # hors de l'arbre (RUNNER_TEMP) : rien d'ajouté à l'archive envoyée à EAS.
      - name: Build iOS beta
        id: build
        if: inputs.action == 'build'
        working-directory: apps/client
        run: |
          set -euo pipefail
          eas build --platform ios --profile beta --non-interactive --wait --json \
            > "$RUNNER_TEMP/eas-build.json"
          BUILD_ID=$(jq -r '.[0].id' "$RUNNER_TEMP/eas-build.json")
          BUILD_NUMBER=$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/eas-build.json")
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "## 🍏 Build iOS beta $BUILD_NUMBER ($BUILD_ID)" >> "$GITHUB_STEP_SUMMARY"

      # EXPO_PUBLIC_APP_ENV=beta : sans lui, app.config.js retombe sur la variante
      # development et la CLI cherche les credentials de fr.ffdanse.connect.dev
      # (cf. scripts/submit-beta.ts).
      - name: Submit to App Store Connect
        id: submit
        if: inputs.action == 'build'
        working-directory: apps/client
        env:
          EXPO_PUBLIC_APP_ENV: beta
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: eas submit --platform ios --profile beta --id "$BUILD_ID" --non-interactive --wait

      - name: Publish OTA update (beta)
        id: ota
        if: inputs.action == 'ota'
        working-directory: apps/client
        # Beta partage l'API + les clés de l'environnement EAS `preview` (Google
        # Maps/Places, Sentry, WAKE_KEY) mais reste la variante beta. Pas de
        # `--environment preview` : il impose aussi EXPO_PUBLIC_APP_ENV=preview,
        # qui l'emporte sur la valeur passée ici (vérifié). L'OTA était alors
        # calculée pour la variante preview : identité fausse, et avec la
        # runtimeVersion `fingerprint`, une empreinte qu'aucun build beta n'a —
        # l'OTA n'aurait atteint personne. On récupère donc les variables dans
        # .env.local (chargé par le bundler, qui ne surcharge jamais une variable
        # déjà posée), sans EXPO_PUBLIC_APP_ENV, et on pose beta nous-mêmes.
        env:
          EXPO_PUBLIC_APP_ENV: beta
        run: |
          set -euo pipefail
          eas env:pull --environment preview --non-interactive --path .env.local
          sed -i '/^EXPO_PUBLIC_APP_ENV=/d' .env.local
          # Bloquant, et AVANT de publier : rien ne build en parallèle ici, une
          # OTA sans build beta compatible est forcément une erreur.
          for p in ios android; do
            RUNTIME=$(eas fingerprint:generate --platform "$p" --json --non-interactive \
              | sed -n '/^{/,$p' | jq -r .hash)
            echo "{\"platform\":\"$p\",\"runtimeVersion\":\"$RUNTIME\"}"
          done | jq -s . > "$RUNNER_TEMP/beta-runtime.json"
          ../../scripts/check-ota-reach.sh beta "$RUNNER_TEMP/beta-runtime.json" --strict
          eas update --branch beta --message "promote staging @ $(git rev-parse --short HEAD)" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Contrôle après coup : l'empreinte publiée est-elle bien celle vérifiée ?
          ../../scripts/check-ota-reach.sh beta "$RUNNER_TEMP/eas-update.json" --strict

      # Published, not drafted: a draft release does NOT create its tag, and the
      # tag is how we check out what a beta actually contained. `--prerelease`
      # keeps these out of "latest release". Runs right after the binary reaches
      # Apple (or the OTA is live), BEFORE the external distribution: a failed
      # distribution must not leave a build in TestFlight with no tag.
      #
      # Tag = what testers see. A build is `beta-<version>-<build number>`, the
      # pair TestFlight displays ("1.0.0 (85)"). An OTA is tagged too: without
      # it the next changelog (built from the last `beta-*` tag) would announce
      # changes testers already received.
      - name: Tag & GitHub Release (beta, prerelease)
        if: steps.submit.outcome == 'success' || steps.ota.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -nE 's/.*version: "([^"]+)", \/\/ x-release-please-version.*/\1/p' apps/client/app.config.js)
          if [ -z "$VERSION" ]; then
            echo "::error::version introuvable dans apps/client/app.config.js (annotation x-release-please-version)"
            exit 1
          fi
          if [ "$ACTION" = "build" ]; then
            TAG="beta-$VERSION-$BUILD_NUMBER"
            TITLE="Beta $VERSION ($BUILD_NUMBER)"
          else
            TAG="beta-$VERSION-ota-$(date +%Y%m%d)-${SHA:0:7}"
            TITLE="Beta $VERSION — OTA ${SHA:0:7}"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG déjà présente (relance) — rien à faire."
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file beta-notes.md \
              --prerelease \
              --target "$SHA"
          fi
          echo "🏷️ Tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      # `eas submit --groups` ne vise que les groupes INTERNES : le groupe
      # EXTERNE et la Beta App Review passent par l'API App Store Connect.
      - name: Distribute to external TestFlight group + Beta App Review
        if: inputs.action == 'build'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: '6787383066'
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          pnpm testflight:distribute --build-number "$BUILD_NUMBER" --notes-file beta-notes.txt
          echo "✅ Build $BUILD_NUMBER ajouté au groupe « Beta FFD » et soumis à la Beta App Review" \
            >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # MASTER — Production (réservé au lancement App Store public).
  # Full build only if native changes, OTA always.
  # ============================================================
  build-production:
    name: EAS Build (production)
    needs: [gate]
    if: |
      needs.gate.outputs.branch == 'master'
      && needs.gate.outputs.client_changed == 'true'
      && needs.gate.outputs.native == 'true'
    runs-on: ubuntu-24.04
    # Submits without --wait: ~8-10 min in practice (install + archive upload).
    # The cap does not count the time spent waiting for the reviewer.
    timeout-minutes: 30
    # Same gate as ota-production, and a native build also costs ~2 USD each.
    environment:
      name: app-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production (iOS only — Android disabled during MVP beta)
        working-directory: apps/client
        run: eas build --profile production --platform ios --non-interactive

  ota-production:
    name: OTA Update (production)
    needs: [gate]
    if: needs.gate.outputs.branch == 'master' && needs.gate.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    # `eas update` takes ~3 min in practice (reviewer wait not counted).
    timeout-minutes: 20
    # Sharpest automatic path in the repo: this ships JavaScript straight to
    # production app users on any master push that touches the client, with no
    # store review in between. `app-production` carries a required reviewer.
    environment:
      name: app-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm & Node
        uses: ./.github/actions/setup-pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/client
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        # --environment production : embarque l'URL API prod dans le bundle OTA.
        run: |
          set -euo pipefail
          eas update --branch production --environment production --message "$COMMIT_MSG" \
            --json --non-interactive > "$RUNNER_TEMP/eas-update.json"
          # Avertit seulement : build-production tourne peut-être en parallèle.
          ../../scripts/check-ota-reach.sh production "$RUNNER_TEMP/eas-update.json"
