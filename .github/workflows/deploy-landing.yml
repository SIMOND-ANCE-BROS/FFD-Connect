# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy landing (GitHub Pages)

# Publishes apps/landing — including the legal documents rendered from
# docs/legal/ — to GitHub Pages. A reachable privacy policy URL is required by
# Apple before a build can go to external TestFlight testers.
#
# Cost: ~1 min of Actions per run, and the path filter keeps it to changes that
# actually alter the site. Pages hosting and bandwidth are free.

on:
  push:
    branches: [staging]
    paths:
      - 'apps/landing/**'
      - 'docs/legal/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# Pages publishes to a single live site, so concurrent runs would race. Queue
# them rather than cancel: the last push must be the one left online.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # actions/configure-pages reads the Pages site to derive base_path; the
      # workflow-level `contents: read` alone makes that call return
      # "Resource not accessible by integration".
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Deliberately not ./.github/actions/setup-pnpm: that one installs the
      # whole workspace, which for the backend means generating the Prisma
      # client. A change to docs/legal/ has no business paying for that, so we
      # set the same pnpm/Node versions by hand and install only the landing.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install (landing only)
        run: pnpm install --frozen-lockfile --prefer-offline --filter landing...

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          # Project sites are served from /<repo>/, so assets need the prefix.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # API used by the reset-password page. The beta runs on backend-staging
          # and backend-prod is stopped, so the page must target staging.
          VITE_API_URL: https://api-staging.ffd.gabin-simond.fr/api/v1
        run: pnpm --filter landing build

      - name: Fail if the legal pages came out empty
        # The pages are generated by a Vite plugin reading docs/legal/*.md. If
        # that ever silently no-ops we would publish blank legal documents, so
        # assert the rendered output really carries its text.
        run: |
          set -euo pipefail
          for page in confidentialite cgu mentions-legales suppression-compte; do
            file="apps/landing/dist/$page/index.html"
            test -f "$file" || { echo "::error::$file missing"; exit 1; }
            bytes=$(wc -c < "$file")
            if [ "$bytes" -lt 3000 ]; then
              echo "::error::$file is only $bytes bytes — the Markdown was not rendered"
              exit 1
            fi
            echo "$page: $bytes bytes"
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
