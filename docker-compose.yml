volumes:
  postgres_data:
  uploads_data:
  redis_data:

services:
  db:
    image: postgres:15-alpine
    profiles: ['infra', 'full']
    restart: always
    environment:
      POSTGRES_USER: ffd
      POSTGRES_PASSWORD: ffdpassword
      POSTGRES_DB: ffd_connect
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ffd -d ffd_connect']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ['infra', 'full']
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    profiles: ['full']
    # Auto-restart on crash/reboot. Without this the container stays dead after
    # a SIGKILL/OOM (db/redis use `always`, frontend uses `unless-stopped`).
    restart: unless-stopped
    # For immutable deploys: IMAGE_TAG is set by the deploy script.
    # For local dev: fall back to building from source with --build.
    image: ${ECR_REGISTRY:-local}/ffd-connect-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://ffd:ffdpassword@db:5432/ffd_connect
      REDIS_HOST: redis
      PORT: 3000
    volumes:
      - uploads_data:/app/apps/backend/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-localhost}
    ports:
      - '8080:80'
    restart: unless-stopped
    environment:
      - VITE_DOCS_URL=/docs
    depends_on:
      - backend
